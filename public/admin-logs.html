<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>操作日志 · 个人日常助手</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div id="page">
  <div class="tabs" id="tabs"></div>
  <div class="row" style="margin-bottom:12px" id="filters">
    <span class="muted small">用户</span><div id="f-user"></div>
    <span class="muted small">日期</span><input class="input inline" type="date" id="d1"><span class="muted">~</span><input class="input inline" type="date" id="d2">
    <span class="muted small">类型</span><div id="f-type"></div>
    <span class="muted small">用时（毫秒）</span><input class="input inline" type="number" id="ms1" style="width:90px" placeholder="最小"><span class="muted">~</span><input class="input inline" type="number" id="ms2" style="width:90px" placeholder="最大">
    <button class="btn primary" id="q">查询</button><button class="btn" id="clear">清空条件</button>
  </div>
  <div class="row" style="margin-bottom:8px"><span id="sum" class="muted small"></span><span class="spacer"></span><span class="hint">日志只可查询，不可修改或删除；删除用户后其日志永久保留</span></div>
  <div class="table-wrap"><table class="table nowrap" id="tbl"></table></div>
  <div class="row" style="margin-top:10px;justify-content:flex-end" id="pager"></div>
</div>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
if (PA.mount({ page: "admin-logs", title: "操作日志", admin: true, narrow: false })) {
  const { state, esc } = PA;
  let tab = "user", page = 1, uSel, tSel;
  const PER = 15;
  function setupFilters() {
    const src = state.logs[tab];
    uSel = PA.multiSelect(document.getElementById("f-user"), [...new Set(src.map((l) => l.user))].map((v) => ({ value: v, label: v })), "全部用户");
    tSel = PA.multiSelect(document.getElementById("f-type"), (tab === "user" ? PA.SEED.logTypesUser : PA.SEED.logTypesAdmin).map((v) => ({ value: v, label: v })), "全部类型");
  }
  function renderTabs() {
    tabs.innerHTML = [["user", "用户操作日志（所有用户）"], ["admin", "管理员操作日志"]].map(([k, l]) => `<div class="tab ${tab === k ? "active" : ""}" data-k="${k}">${l}</div>`).join("");
    tabs.querySelectorAll(".tab").forEach((el) => (el.onclick = () => { tab = el.dataset.k; page = 1; renderTabs(); setupFilters(); render(); }));
  }
  function render() {
    const us = uSel.values(), ts = tSel.values(), a = +ms1.value || 0, b = +ms2.value || Infinity;
    const list = state.logs[tab].filter((l) => (!us.length || us.includes(l.user)) && (!ts.length || ts.includes(l.type)) && (!d1.value || l.time.slice(0, 10) >= d1.value) && (!d2.value || l.time.slice(0, 10) <= d2.value) && l.ms >= a && l.ms <= b);
    const pages = Math.max(1, Math.ceil(list.length / PER)); page = Math.min(page, pages);
    sum.textContent = `共 ${list.length} 条`;
    tbl.innerHTML = `<tr><th>时间</th><th>${tab === "admin" ? "管理员" : "用户"}</th><th>类型</th><th>内容</th><th>结果</th><th>用时</th><th>IP</th></tr>` + (list.slice((page - 1) * PER, page * PER).map((l) => `<tr><td class="small" style="white-space:nowrap">${esc(l.time)}</td><td>${esc(l.user)}</td><td><span class="badge">${esc(l.type)}</span></td><td class="small" style="white-space:normal;min-width:200px">${esc(l.detail)}</td><td>${l.ok ? '<span class="badge green">成功</span>' : '<span class="badge red">失败</span>'}</td><td class="small" style="white-space:nowrap">${l.ms >= 1000 ? (l.ms / 1000).toFixed(1) + " 秒" : l.ms + " ms"}</td><td class="small muted">${esc(l.ip)}</td></tr>`).join("") || '<tr><td colspan="7" class="empty">没有符合条件的日志</td></tr>');
    pager.innerHTML = `<button class="btn sm" ${page <= 1 ? "disabled" : ""} id="prev">上一页</button><span class="small">${page} / ${pages}</span><button class="btn sm" ${page >= pages ? "disabled" : ""} id="next">下一页</button>`;
    document.getElementById("prev").onclick = () => { page--; render(); };
    document.getElementById("next").onclick = () => { page++; render(); };
  }
  document.getElementById("q").onclick = () => { page = 1; render(); };
  document.getElementById("clear").onclick = () => { [d1, d2, ms1, ms2].forEach((i) => (i.value = "")); setupFilters(); page = 1; render(); };
  renderTabs(); setupFilters(); render();
}
</script>
</body>
</html>

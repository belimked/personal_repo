<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>待办详情 · 个人日常助手</title>
<link rel="stylesheet" href="assets/app.css">
<style>
  .when-line { margin: -4px 0 12px; color: var(--muted); font-size: 13px; }
  .card-head .star { font-size: 18px; }
  .att-drop.over { outline: 2px dashed var(--primary); outline-offset: -4px; background: var(--primary-weak); }
</style>
</head>
<body>
<div id="page">
  <div class="row" style="margin-bottom:12px"><a href="todos.html">← 返回待办列表</a></div>
  <div id="view"></div>
</div>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
if (PA.mount({ page: "todos", title: "待办详情" })) {
  const { state, esc, save, fmtDate, toast, log } = PA;
  const view = document.getElementById("view");
  const t = PA.todoById(PA.qs("id"));
  if (!t) view.innerHTML = '<div class="card empty">待办不存在</div>';
  else {
    let shownStatus = null;
    const render = () => {
      if (!state.todos.includes(t)) { view.innerHTML = '<div class="card empty">这条待办已被彻底删除。<a href="todos.html?view=list&tab=deleted">返回待办列表</a></div>'; return; }
      shownStatus = t.status;
      const src = t.sourceFile && PA.fileById(t.sourceFile);
      const del = t.status === "deleted";
      view.innerHTML = `
      <div class="card">
        <div class="card-head"><span class="star ${t.starred ? "on" : ""}" data-star title="${t.starred ? "取消星标" : "标为重要（待安排里排在前面）"}">★</span><h2>${esc(t.title)}</h2><span class="badge ${t.status === "open" ? "blue" : t.status === "done" ? "green" : ""}">${PA.STATUS_LABEL[t.status]}</span><span class="badge">${PA.SOURCE_LABEL[t.source]}</span><span class="spacer"></span>
          ${t.status === "open" ? '<button class="btn" data-op="done">✓ 标记完成</button>' : t.status === "done" ? '<button class="btn" data-op="reopen">改回未完成</button>' : ""}
          ${del ? '<button class="btn primary" data-op="restore">恢复</button><button class="btn danger" data-op="purge">彻底删除</button>' : '<button class="btn danger" data-op="delete">删除</button>'}</div>
        <div class="when-line">🕒 ${esc(PA.whenText(t))}${del ? " · 已删除，不出现在待办列表和提醒中" : ""}</div>
        <div class="grid2">
          <div class="field"><label>待办内容</label><input class="input" data-k="title" value="${esc(t.title)}"></div>
          <div class="field"><label>地点</label><input class="input" data-k="location" value="${esc(t.location)}"></div>
        </div>
        <div class="field"><label>时间</label><div id="d-dtp"></div></div>
        <div class="field"><label>备注</label><textarea class="input" rows="3" data-k="notes" placeholder="长期不变的说明">${esc(t.notes)}</textarea></div>
        <div class="field"><label>标签</label><div id="d-tags"></div></div>
        <div class="row"><button class="btn primary" data-op="save">保存修改</button><span class="hint">创建于 ${esc(t.createdAt)}${t.updatedAt ? ` · 更新于 ${esc(t.updatedAt)}` : ""} · 来源：${PA.SOURCE_LABEL[t.source]}${src ? `（<a href="files.html?file=${src.id}">${esc(src.name)}</a>）` : ""}</span></div>
      </div>
      <div class="card"><div class="card-head"><h3>想法记录</h3><span class="hint">追加式，新的在上；网址自动变成链接，带的文件同时归入附件</span></div><div id="d-rec"></div></div>
      ${t.actionItems ? `<div class="card"><div class="card-head"><h3>会议行动项</h3><span class="hint">由会议录音识别，保存为本会议的备注</span></div>
        ${t.actionItems.map((a, i) => `<div class="ai-item"><span class="owner ${a.owner === "我" ? "me" : ""}">${esc(a.owner)}</span><div style="flex:1">${esc(a.text)}${a.due ? ` <span class="muted small">· ${fmtDate(a.due)}</span>` : ""}</div>
          ${a.converted ? `<a class="small" href="todo.html?id=${a.converted}">已转为我的待办 →</a>` : `<button class="btn sm" data-conv="${i}">转为我的待办</button>`}</div>`).join("")}</div>` : ""}
      <div class="card att-drop" id="att-card"></div>`;
      const q = (s) => view.querySelector(s);
      const dtp = PA.dateTimePicker(q("#d-dtp"), { date: t.date, time: t.time, duration: t.duration, deadline: t.deadline });
      PA.tagEditor(q("#d-tags"), { value: t.tags || [], onChange: (tags, ch) => {
        t.tags = tags; t.updatedAt = PA.nowStr(); save();
        log("修改标签", `${t.title}：${ch.added ? "加上 " + ch.added : "去掉 " + ch.removed}`);
        PA.todosChanged();
      } });
      PA.recordsBox(q("#d-rec"), t, { compact: !!t.date, onChange: () => { renderAtt(); PA.todosChanged(); } });
      q("[data-star]").onclick = (e) => { t.starred = !t.starred; save(); log("手动更新待办", `${t.title}：${t.starred ? "加星标" : "取消星标"}`); e.currentTarget.classList.toggle("on", t.starred); PA.todosChanged(); };
      q('[data-op="save"]').onclick = () => {
        const v = {}; view.querySelectorAll("[data-k]").forEach((i) => (v[i.dataset.k] = i.value.trim()));
        if (!v.title) { toast("待办内容不能为空"); return; }
        const w = dtp.value();
        Object.assign(t, v, { date: w.date, time: w.time, duration: w.duration, deadline: w.date ? null : w.deadline, updatedAt: PA.nowStr() });
        save(); log("手动更新待办", t.title); toast("已保存"); PA.todosChanged(); render();
      };
      const op = (k, fn) => { const b = q(`[data-op="${k}"]`); if (b) b.onclick = fn; };
      op("done", () => { PA.completeTodos([t]); PA.todosChanged(); });
      op("reopen", () => { PA.setStatus([t], "open"); toast("已改回未完成"); PA.todosChanged(); });
      op("restore", () => { PA.setStatus([t], "open"); toast("已恢复为未完成"); PA.todosChanged(); });
      op("delete", () => PA.deleteTodo(t));
      op("purge", () => PA.purgeTodo(t, () => (location.href = "todos.html?view=list&tab=deleted")));
      view.querySelectorAll("[data-conv]").forEach((b) => (b.onclick = () => {
        const a = t.actionItems[+b.dataset.conv], now = PA.nowStr();
        const notes = `来自会议：${t.title}${a.owner !== "我" ? "（原负责人：" + a.owner + "）" : ""}`;
        const nt = { id: PA.uid("t"), title: a.text, date: a.due || "", time: "", location: "", notes, status: "open", source: "meeting", sourceFile: t.sourceFile, attachments: [], tags: PA.autoTags(a.text + " " + notes, []), starred: false, deadline: null, records: [], createdAt: now, updatedAt: now };
        state.todos.push(nt); a.converted = nt.id; save(); log("手动创建待办", "会议行动项转为待办：" + a.text); toast("已创建待办"); PA.todosChanged(); render();
      }));
      renderAtt();
    };

    // 附件卡片单独刷新，避免上传进度刷新时冲掉正在编辑的表单
    function renderAtt() {
      const card = document.getElementById("att-card");
      if (!card) return;
      const ups = state.uploads.filter((u) => (u.todoIds || []).includes(t.id) && u.status !== "done");
      card.innerHTML = `<div class="card-head"><h3>附件（${t.attachments.length}）</h3><span class="hint">附件保存在个人知识库，同一文件可关联多个待办；可把文件拖到这里</span><span class="spacer"></span>
          <button class="btn" data-att="kb">从知识库选择</button><button class="btn primary" data-att="up">⬆ 上传文件</button></div>
        ${ups.length ? `<div class="row" style="gap:6px;margin-bottom:8px">${ups.map((u) => `<span class="tag file uploading">${PA.fileIcon(u)} ${esc(u.displayName || u.name)} <span class="small muted">${u.status === "failed" ? '<span style="color:var(--danger)">失败</span>' : u.status === "uploading" ? `上传中 ${Math.floor(u.progress)}%` : u.status === "waiting" ? "等待上传" : "处理中…"}</span></span>`).join("")}<span class="hint">完成后自动关联</span></div>` : ""}
        ${t.attachments.length ? `<div class="table-wrap"><table class="table"><tr><th>文件</th><th>大小</th><th>标签</th><th>也关联到</th><th></th></tr>${t.attachments.map(PA.fileById).filter(Boolean).map((f) => {
          const others = PA.linkedTodos(f.id).filter((x) => x.id !== t.id);
          return `<tr><td>${PA.fileIcon(f)} ${esc(f.name)}</td><td>${PA.fmtSize(f.size)}</td><td>${PA.tagChips(f.tags)}</td><td class="small">${others.length ? others.map((o) => `<a href="todo.html?id=${o.id}">${esc(o.title)}</a>`).join("、") : '<span class="muted">—</span>'}</td>
            <td style="white-space:nowrap">${PA.canPreview(f) ? `<button class="btn sm" data-fprev="${f.id}">预览</button> ` : ""}<button class="btn sm" data-fdl="${f.id}">下载</button> <button class="btn sm ghost" data-unlink="${f.id}" title="只解除关联，不删除知识库中的文件">解除关联</button></td></tr>`;
        }).join("")}</table></div>` : '<div class="muted small">暂无附件</div>'}`;
      card.querySelector('[data-att="up"]').onclick = () => { const input = document.createElement("input"); input.type = "file"; input.multiple = true; input.onchange = () => upload([...input.files]); input.click(); };
      card.querySelector('[data-att="kb"]').onclick = () => PA.kbPicker(t.attachments, (ids) => {
        const added = ids.filter((id) => !t.attachments.includes(id)), removed = t.attachments.filter((id) => !ids.includes(id));
        if (!added.length && !removed.length) return;
        t.attachments = ids; t.updatedAt = PA.nowStr(); save();
        log("手动更新待办", `${t.title}：附件${added.length ? ` 关联 ${added.length} 个` : ""}${removed.length ? ` 解除 ${removed.length} 个` : ""}`);
        toast(`已更新附件（${ids.length} 个）`); renderAtt(); PA.todosChanged();
      });
      card.querySelectorAll("[data-fprev]").forEach((b) => (b.onclick = () => PA.openPreview(b.dataset.fprev)));
      card.querySelectorAll("[data-fdl]").forEach((b) => (b.onclick = () => PA.download(PA.fileById(b.dataset.fdl))));
      card.querySelectorAll("[data-unlink]").forEach((b) => (b.onclick = () => {
        t.attachments = t.attachments.filter((x) => x !== b.dataset.unlink); t.updatedAt = PA.nowStr(); save();
        log("手动更新待办", `${t.title} 解除附件关联`); toast("已解除关联，文件仍在知识库中"); renderAtt(); PA.renderPreview(); PA.todosChanged();
      }));
      card.ondragover = (e) => { if ([...e.dataTransfer.types].includes("Files")) { e.preventDefault(); card.classList.add("over"); } };
      card.ondragleave = (e) => { if (!card.contains(e.relatedTarget)) card.classList.remove("over"); };
      card.ondrop = (e) => { e.preventDefault(); card.classList.remove("over"); upload([...e.dataTransfer.files]); };
    }
    function upload(files) {
      if (!files.length) return;
      PA.startUpload(files, { quiet: true, todoId: t.id });
      save(); renderAtt();
    }
    document.addEventListener("pa:files-changed", renderAtt);
    document.addEventListener("pa:uploads-tick", () => { if (state.uploads.some((u) => (u.todoIds || []).includes(t.id))) renderAtt(); });
    document.addEventListener("pa:todos-changed", () => { if (!state.todos.includes(t) || t.status !== shownStatus) render(); });
    render();
  }
}
</script>
</body>
</html>

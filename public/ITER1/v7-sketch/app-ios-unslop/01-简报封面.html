<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小禾 · 简报封面</title><link rel="stylesheet" href="app.css"></head>
<body>
<main class="screen">
  <div data-sb></div>
  <div class="body">
    <button class="switch"><span class="mark">禾</span>管家<i data-i="down"></i></button>

    <header class="head">
      <h1 class="title">3 件事等你定</h1>
      <p class="lede">都已备好办法，过一遍约 2 分钟</p>
    </header>

    <section class="card" aria-label="今日简报">
      <div class="brief-top"><span>周五简报</span><span class="mono">16:00</span></div>
      <a class="item" href="02-逐件过.html">
        <span class="no mono">01</span>
        <div class="main"><div class="h">小周的周报</div><div class="s">2 处和例会不一样，意见已写好</div></div>
        <i data-i="right" class="chev"></i>
      </a>
      <a class="item" href="#">
        <span class="no mono">02</span>
        <div class="main"><div class="h">客户问能否提前上线</div><div class="s">建议不整体提前，回复已拟好</div></div>
        <i data-i="right" class="chev"></i>
      </a>
      <a class="item" href="#">
        <span class="no mono">03</span>
        <div class="main"><div class="h">团队周报</div><div class="s">已写好，确认就发</div></div>
        <span class="meta mono">18:00 前</span>
      </a>
    </section>

    <div class="grow"></div>
    <div class="actions">
      <a class="btn btn-primary" href="02-逐件过.html">开始</a>
      <button class="btn btn-second"><i data-i="msg"></i>说一句</button>
    </div>
    <p style="font-size:13px;line-height:18px;color:var(--t3);text-align:center;padding-bottom:12px">另有 <span class="num">7</span> 件我在办，不用你管</p>
  </div>
  <div data-tabs="管家"></div>
</main>
<script src="shell.js"></script>
</body></html>

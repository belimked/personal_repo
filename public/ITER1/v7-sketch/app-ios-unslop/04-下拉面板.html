<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小禾 · 下拉面板</title><link rel="stylesheet" href="app.css">
<style>
.under{position:absolute;inset:0;display:flex;flex-direction:column;filter:blur(2px)}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.28)}
.top{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column}
.top .switch{margin:4px 16px 0}
.panel{margin:12px 16px 0;background:var(--card);border-radius:20px;padding:12px 0 4px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.search{margin:0 12px 8px;height:40px;border-radius:10px;background:#EFEFF4;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--t3);font-size:17px}
.search svg{width:18px;height:18px}
.panel .row .ic{width:32px;height:32px;border-radius:8px;background:#F2F2F7;display:grid;place-items:center;color:var(--t2)}
.panel .row .ic svg{width:18px;height:18px}
.grab{width:36px;height:5px;border-radius:3px;background:#C7C7CC;margin:8px auto 4px}
</style></head>
<body>
<main class="screen">
  <!-- 底层：压暗的简报封面 -->
  <div class="under" aria-hidden="true">
    <div style="height:54px"></div>
    <div class="body">
      <div style="height:40px"></div>
      <header class="head"><div class="title">3 件事等你定</div><p class="lede">都已备好办法，过一遍约 2 分钟</p></header>
      <section class="card" style="height:300px"></section>
      <div class="grow"></div>
      <div class="actions"><span class="btn btn-primary">开始</span><span class="btn btn-second">说一句</span></div>
      <div style="height:30px"></div>
    </div>
    <div data-tabs="管家"></div>
  </div>
  <div class="scrim"></div>

  <div class="top">
    <div data-sb></div>
    <button class="switch"><span class="mark">禾</span>管家<i data-i="up"></i></button>
    <section class="panel">
      <label class="search"><i data-i="search"></i>搜索</label>
      <a class="row" href="#"><span class="ic"><i data-i="cal"></i></span><span class="label">日程</span><span class="value">今天 <span class="num">2</span> 个会</span><i data-i="right" class="chev"></i></a>
      <a class="row" href="#"><span class="ic"><i data-i="hist"></i></span><span class="label">历史事情</span><span class="value">本周办完 <span class="num">12</span> 件</span><i data-i="right" class="chev"></i></a>
      <a class="row" href="#"><span class="ic"><i data-i="folder"></i></span><span class="label">交给我的资料</span><span class="value"><span class="num">86</span> 份</span><i data-i="right" class="chev"></i></a>
      <a class="row" href="#"><span class="ic"><i data-i="cam"></i></span><span class="label">交资料</span><span class="value">拍照、文件、链接</span><i data-i="right" class="chev"></i></a>
      <a class="row" href="#"><span class="ic"><i data-i="gear"></i></span><span class="label">设置</span><span class="value">主动服务开</span><i data-i="right" class="chev"></i></a>
      <div class="grab"></div>
    </section>
  </div>
</main>
<script src="shell.js"></script>
</body></html>

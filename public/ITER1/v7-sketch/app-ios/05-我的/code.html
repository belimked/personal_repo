<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>我的</title>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          systemBg: "#F2F2F7",
          cardBg: "#FFFFFF",
          primary: "#3F6EE8",
          darkText: "#1C1C1E",
          secondaryText: "#8E8E93",
          tertiaryText: "#C7C7CC",
          separator: "#E5E5EA",
        },
        fontFamily: {
          sans: [
            "-apple-system",
            "BlinkMacSystemFont",
            '"SF Pro Text"',
            '"SF Pro Display"',
            '"PingFang SC"',
            '"Helvetica Neue"',
            "sans-serif"
          ],
        },
      },
    },
  }
</script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    background-color: #F2F2F7;
  }
  .ios-hairline {
    border-bottom: 0.5px solid #E5E5EA;
  }
  .ios-cell:active {
    background-color: #F2F2F7;
  }
  .symbol-thin {
    font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
  }
</style>
<style id="ios-fix">
body *:not(.material-symbols-outlined){font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans SC",sans-serif !important}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24 !important}
</style>
</head>
<body class="bg-systemBg text-darkText min-h-screen flex flex-col justify-between selection:bg-primary/20">
<!-- Main Scroll Container -->
<div class="flex-1 w-full max-w-md mx-auto flex flex-col pb-28">
<!-- 1. iOS Status Bar with Dynamic Island -->
<header class="w-full pt-3 px-7 flex justify-between items-center z-40 text-darkText relative">
<!-- Time -->
<span class="text-[15px] font-semibold tracking-tight text-darkText">16:00</span>
<!-- Dynamic Island Capsule -->
<div class="absolute left-1/2 -translate-x-1/2 top-2.5 w-[124px] h-[34px] bg-black rounded-full flex items-center justify-between px-3 pointer-events-none shadow-sm">
<div class="w-3 h-3 rounded-full bg-[#111111] flex items-center justify-center">
<div class="w-2 h-2 rounded-full bg-[#1A1A24]/90 border border-neutral-800"></div>
</div>
<div class="w-2.5 h-2.5 rounded-full bg-[#0a0a0f] ring-1 ring-neutral-900/50"></div>
</div>
<!-- System Status Glyphs (Signal, Wi-Fi, Battery) -->
<div class="flex items-center gap-1.5 text-darkText">
<span class="material-symbols-outlined text-[16px] leading-none" data-icon="signal_cellular_alt">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[16px] leading-none" data-icon="wifi">wifi</span>
<span class="material-symbols-outlined text-[20px] leading-none font-light" data-icon="battery_full">battery_full</span>
</div>
</header>
<!-- 2. Large Title Header (Without ... button) -->
<section class="w-full px-5 pt-5 pb-3">
<h1 class="text-[32px] leading-tight font-bold text-darkText tracking-tight">我的</h1>
</section>
<!-- 3. Cards Section -->
<main class="flex-1 px-4 space-y-4">
<!-- User Profile Card -->
<section class="rounded-2xl bg-cardBg overflow-hidden shadow-[0_1px_3px_rgba(0,0,0,0.02)]">
<a aria-label="个人信息与账户" class="ios-cell flex items-center px-4 py-3.5 transition-colors duration-150" href="#profile">
<!-- Deep blue circular avatar -->
<div class="w-14 h-14 rounded-full bg-primary flex items-center justify-center text-white text-[22px] font-semibold flex-shrink-0">
          陆
        </div>
<!-- User Details -->
<div class="ml-3.5 flex-1 min-w-0">
<div class="text-[19px] leading-[24px] font-bold text-darkText tracking-tight truncate">
            陆航
          </div>
<div class="text-[13px] text-secondaryText truncate mt-0.5 font-normal">
            luhang@company.com
          </div>
</div>
<!-- Disclosure Indicator -->
<span class="material-symbols-outlined text-tertiaryText text-[20px] flex-shrink-0 ml-2" data-icon="chevron_right">chevron_right</span>
</a>
</section>
<!-- Member & Points Card -->
<section class="rounded-2xl bg-cardBg overflow-hidden shadow-[0_1px_3px_rgba(0,0,0,0.02)]">
<a aria-label="会员与点数" class="ios-cell flex items-center justify-between px-4 py-3.5 transition-colors duration-150" href="#membership">
<span class="text-[16px] font-medium text-darkText">会员与点数</span>
<div class="flex items-center space-x-1">
<span class="text-[14px] font-normal text-secondaryText">本月剩 320 点</span>
<span class="material-symbols-outlined text-tertiaryText text-[18px]" data-icon="chevron_right">chevron_right</span>
</div>
</a>
</section>
<!-- Settings Group -->
<section class="space-y-1.5">
<!-- Group Header -->
<header class="px-2">
<h2 class="text-[13px] text-secondaryText font-normal">设置</h2>
</header>
<!-- Grouped List Container -->
<div class="rounded-2xl bg-cardBg overflow-hidden shadow-[0_1px_3px_rgba(0,0,0,0.02)]">
<!-- Row 1: 主动服务 -->
<a aria-label="主动服务" class="ios-cell flex items-center justify-between px-4 py-3.5 relative transition-colors duration-150" href="#proactive-service">
<span class="text-[16px] font-medium text-darkText">主动服务</span>
<div class="flex items-center space-x-1">
<span class="text-[14px] text-secondaryText">开</span>
<span class="material-symbols-outlined text-tertiaryText text-[18px]" data-icon="chevron_right">chevron_right</span>
</div>
<div class="ios-hairline absolute bottom-0 left-4 right-0 pointer-events-none"></div>
</a>
<!-- Row 2: 工作邮箱 -->
<a aria-label="工作邮箱" class="ios-cell flex items-center justify-between px-4 py-3.5 relative transition-colors duration-150" href="#work-email">
<span class="text-[16px] font-medium text-darkText">工作邮箱</span>
<div class="flex items-center space-x-1">
<span class="text-[14px] text-secondaryText">已接入 · 只读</span>
<span class="material-symbols-outlined text-tertiaryText text-[18px]" data-icon="chevron_right">chevron_right</span>
</div>
<div class="ios-hairline absolute bottom-0 left-4 right-0 pointer-events-none"></div>
</a>
<!-- Row 3: 通知 -->
<a aria-label="通知" class="ios-cell flex items-center justify-between px-4 py-3.5 relative transition-colors duration-150" href="#notifications">
<span class="text-[16px] font-medium text-darkText">通知</span>
<div class="flex items-center space-x-1">
<span class="text-[14px] text-secondaryText">只发错过就晚的</span>
<span class="material-symbols-outlined text-tertiaryText text-[18px]" data-icon="chevron_right">chevron_right</span>
</div>
<div class="ios-hairline absolute bottom-0 left-4 right-0 pointer-events-none"></div>
</a>
<!-- Row 4: 通用 -->
<a aria-label="通用" class="ios-cell flex items-center justify-between px-4 py-3.5 relative transition-colors duration-150" href="#general">
<span class="text-[16px] font-medium text-darkText">通用</span>
<div class="flex items-center">
<span class="material-symbols-outlined text-tertiaryText text-[18px]" data-icon="chevron_right">chevron_right</span>
</div>
</a>
</div>
</section>
<!-- Privacy Group -->
<section class="rounded-2xl bg-cardBg overflow-hidden shadow-[0_1px_3px_rgba(0,0,0,0.02)]">
<a aria-label="隐私与个人信息" class="ios-cell flex items-center justify-between px-4 py-3.5 transition-colors duration-150" href="#privacy">
<span class="text-[16px] font-medium text-darkText">隐私与个人信息</span>
<div class="flex items-center">
<span class="material-symbols-outlined text-tertiaryText text-[18px]" data-icon="chevron_right">chevron_right</span>
</div>
</a>
</section>
</main>
</div>
<!-- 4. iOS Native Bottom Tab Bar -->
<nav aria-label="底栏导航" class="fixed bottom-0 left-0 right-0 z-50 bg-[#F9F9FB]/85 backdrop-blur-xl border-t border-separator/80 px-6 pt-2 pb-7">
<div class="max-w-md mx-auto flex justify-around items-center">
<!-- Tab 1: 管家 (Thin outline house icon) -->
<a class="flex flex-col items-center justify-center text-secondaryText active:opacity-60 transition-opacity" href="#butler">
<span class="material-symbols-outlined symbol-thin text-[25px]" data-icon="home">home</span>
<span class="text-[10px] mt-0.5 font-medium">管家</span>
</a>
<!-- Tab 2: 盯着 (Thin outline eye icon) -->
<a class="flex flex-col items-center justify-center text-secondaryText active:opacity-60 transition-opacity" href="#focus">
<span class="material-symbols-outlined symbol-thin text-[25px]" data-icon="visibility">visibility</span>
<span class="text-[10px] mt-0.5 font-medium">盯着</span>
</a>
<!-- Tab 3: 我的 (Active: Thin outline person icon in #3F6EE8) -->
<a aria-current="page" class="flex flex-col items-center justify-center text-primary active:opacity-60 transition-opacity" href="#profile">
<span class="material-symbols-outlined symbol-thin text-[25px]" data-icon="person">person</span>
<span class="text-[10px] mt-0.5 font-semibold text-primary">我的</span>
</a>
</div>
<!-- iOS Home Indicator -->
<div class="absolute bottom-1.5 left-1/2 -translate-x-1/2 w-[134px] h-[5px] bg-[#000000] rounded-full opacity-30 pointer-events-none"></div>
</nav>
</body></html>

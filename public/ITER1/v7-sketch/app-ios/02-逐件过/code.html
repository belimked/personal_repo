<body class="h-full flex items-center justify-center p-0 md:p-6 overflow-hidden select-none">
<!-- iOS Device Frame Container (390 x 844) -->
<main class="ios-shell relative flex flex-col justify-between overflow-hidden shadow-2xl md:rounded-[54px] border border-black/10">
<!-- TOP SECTION: Status Bar & Navigation Bar -->
<div class="w-full flex flex-col shrink-0 z-30 bg-[#F2F2F7]/90 backdrop-blur-xl">
<!-- iOS Status Bar (47pt classic / 54pt dynamic notch) -->
<div class="w-full h-11 pt-3 px-7 flex items-center justify-between text-on-surface">
<!-- Time -->
<span class="text-[15px] font-semibold tracking-tight text-black pl-1">16:00</span>
<!-- Dynamic Island Placeholder -->
<div class="h-7 w-[122px] bg-black rounded-full flex items-center justify-between px-3 -mt-1 ml-1.5 shadow-sm">
<div class="w-2.5 h-2.5 rounded-full bg-black/80 flex items-center justify-center">
<div class="w-1.5 h-1.5 rounded-full bg-[#1c1c1e]"></div>
</div>
<div class="w-2.5 h-2.5 rounded-full bg-[#0a0a0c]"></div>
</div>
<!-- System Status Icons (Signal, Wifi, Battery) -->
<div class="flex items-center space-x-1.5 text-black pr-1">
<span class="material-symbols-outlined text-[17px] leading-none" data-icon="signal_cellular_alt">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[16px] leading-none" data-icon="wifi">wifi</span>
<div class="w-[24px] h-[11.5px] border-[1.5px] border-black rounded-[4px] p-[1px] flex items-center relative ml-0.5">
<div class="h-full w-[80%] bg-black rounded-[2px]"></div>
<div class="absolute -right-[3px] top-[2.5px] h-[4px] w-[1.5px] bg-black rounded-r-[1px]"></div>
</div>
</div>
</div>
<!-- Navigation Bar (44pt) -->
<header class="h-11 px-4 flex items-center justify-between relative">
<!-- Leading: Back Action -->
<button aria-label="返回简报" class="flex items-center text-primary-container active:opacity-60 transition-opacity -ml-1 text-[17px]" type="button">
<span class="material-symbols-outlined text-[20px] font-bold" data-icon="arrow_back_ios_new">arrow_back_ios_new</span>
<span class="font-normal -ml-0.5 tracking-tight font-body text-body">简报</span>
</button>
<!-- Center: Headline (1/3) -->
<div class="absolute inset-x-0 flex justify-center pointer-events-none">
<h1 class="font-headline text-headline text-on-surface tracking-tight font-semibold">1 / 3</h1>
</div>
<!-- Trailing: Defer Action Button -->
<button class="text-primary-container font-body text-body active:opacity-60 transition-opacity tracking-tight -mr-1" type="button">
          稍后
        </button>
</header>
<!-- Segmented Pill Progress Indicator -->
<div class="px-4 pt-2 pb-3">
<div class="flex items-center gap-1.5 w-full">
<!-- Item 1 (Active) -->
<div class="h-1 flex-1 rounded-full bg-primary-container transition-all"></div>
<!-- Item 2 (Inactive) -->
<div class="h-1 flex-1 rounded-full bg-[#E5E5EA] transition-all"></div>
<!-- Item 3 (Inactive) -->
<div class="h-1 flex-1 rounded-full bg-[#E5E5EA] transition-all"></div>
</div>
</div>
</div>
<!-- MAIN SCROLLABLE CONTENT CANVAS (Single item review focus) -->
<div class="flex-1 w-full px-4 pt-2 overflow-y-auto flex flex-col justify-start">
<!-- Core Inset Grouped Card -->
<section class="w-full bg-surface-container-lowest rounded-xl p-5 shadow-[0_1px_3px_rgba(0,0,0,0.03)] border border-black/[0.04] flex flex-col gap-4">
<!-- Card Main Title -->
<div class="space-y-1">
<div class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-[#EBF1FE] text-primary-container text-[11px] font-caption-2 font-medium mb-1">
<span class="material-symbols-outlined text-[13px]" data-icon="flag">flag</span>
<span>待确认事项</span>
</div>
<h2 class="text-title-3 font-title-3 text-on-surface leading-snug tracking-tight">
            小周的周报有 2 处和例会不一样
          </h2>
</div>
<!-- Bullet List Points -->
<div class="space-y-3 pt-1">
<!-- Point 1 -->
<div class="flex items-start gap-2.5">
<div class="w-1.5 h-1.5 rounded-full bg-primary-container mt-2 shrink-0"></div>
<p class="font-subheadline text-subheadline text-on-surface leading-relaxed">
<span class="font-headline text-on-surface">支付对接：</span>他写“本周完成”，例会定的是下周三
            </p>
</div>
<!-- Point 2 -->
<div class="flex items-start gap-2.5">
<div class="w-1.5 h-1.5 rounded-full bg-primary-container mt-2 shrink-0"></div>
<p class="font-subheadline text-subheadline text-on-surface leading-relaxed">
              漏了“压测报告”
            </p>
</div>
</div>
<!-- Recommended Reply Container (Light blue tint box) -->
<div class="rounded-lg bg-[#EBF1FE] p-3.5 mt-1 border border-primary-container/10">
<div class="flex items-start gap-2">
<span class="material-symbols-outlined text-primary-container text-[18px] shrink-0 mt-0.5" data-icon="smart_toy">smart_toy</span>
<p class="font-subheadline text-subheadline text-[#1A45A0] leading-relaxed select-text">
<span class="font-semibold text-primary-container">建议回复：</span>“支付对接按例会改成下周三完成；另外补上压测报告。”
            </p>
</div>
</div>
<!-- Hairline Divider -->
<div class="w-full h-[0.5px] bg-[#3C3C43]/15 mt-1"></div>
<!-- Metadata Row -->
<div class="flex items-center justify-between pt-0.5 text-footnote font-footnote">
<!-- Left: Source Citation (Tappable Link) -->
<a class="inline-flex items-center text-primary-container active:opacity-60 transition-opacity gap-0.5 text-[14px]" href="#">
<span>出处：周三例会纪要</span>
<span class="material-symbols-outlined text-[15px]" data-icon="chevron_right">chevron_right</span>
</a>
<!-- Right: AI Watermark -->
<span class="text-[12px] text-[#3C3C43]/50 font-caption-1 tracking-tight">
            内容由 AI 生成
          </span>
</div>
</section>
<!-- Context Hint Box (Quiet helper to enrich single-task flow) -->
<div class="px-3 pt-4 flex items-center justify-center gap-1.5 text-on-surface-variant/70 text-caption-1 font-caption-1">
<span class="material-symbols-outlined text-[14px]" data-icon="swipe">swipe</span>
<span>向右滑动可暂存至稍后处理</span>
</div>
</div>
<!-- BOTTOM FIXED INTERACTION AREA (No Tab Bar, Dedicated Task Flow) -->
<footer class="w-full shrink-0 bg-[#F2F2F7]/95 backdrop-blur-xl px-4 pt-3 pb-2 flex flex-col items-center">
<!-- Primary Action Button (H: 50pt, Radius: 12pt, Color: #3F6EE8) -->
<button class="w-full h-[50px] bg-primary-container active:scale-[0.98] active:opacity-90 transition-all rounded-xl flex items-center justify-center shadow-[0_4px_12px_rgba(63,110,232,0.25)] text-on-primary" type="button">
<span class="font-headline text-headline text-white tracking-normal font-semibold">
          确认，发给小周…
        </span>
</button>
<!-- Secondary Plain Link Action -->
<div class="pt-3 pb-2">
<button class="text-primary-container font-subheadline text-[14px] tracking-wide active:opacity-50 transition-opacity" type="button">
          改一改 · 这不算问题
        </button>
</div>
<!-- iOS Home Indicator -->
<div class="w-full flex justify-center pt-2 pb-1">
<div class="w-[134px] h-[5px] bg-black/85 rounded-full"></div>
</div>
</footer>
</main>
<script>
    // Lightweight tactile feedback for iOS active feeling
    document.querySelectorAll('button, a').forEach(el => {
      el.addEventListener('touchstart', () => {}, {passive: true});

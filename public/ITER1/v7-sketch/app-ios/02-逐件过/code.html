<div class="w-full h-11 pt-3 px-7 flex items-center justify-between text-on-surface">

<span class="text-[15px] font-semibold tracking-tight text-[#1d1b18] pl-1">16:00</span>

<div class="h-7 w-[122px] bg-[#1d1b18] rounded-full flex items-center justify-between px-3 -mt-1 ml-1.5 shadow-sm">
<div class="w-2.5 h-2.5 rounded-full bg-black/80 flex items-center justify-center">

</div>

</div>

<div class="w-[24px] h-[11.5px] border-[1.5px] border-[#1d1b18] rounded-[4px] p-[1px] flex items-center relative ml-0.5">
<div class="h-full w-[80%] bg-[#1d1b18] rounded-[2px]"></div>
<div class="absolute -right-[3px] top-[2.5px] h-[4px] w-[1.5px] bg-[#1d1b18] rounded-r-[1px]"></div>
</div>
</div>
</div>
<!-- Navigation Bar (44pt) -->

<div class="absolute inset-x-0 flex justify-center pointer-events-none items-center">

</div>

<div class="flex-1 w-full px-4 pt-3.5 overflow-y-auto flex flex-col justify-start">

<section class="w-full bg-[#ffffff] p-5 border flex flex-col shadow-sm" style="background-color: rgb(255, 255, 255); border-radius: 20px; border: 0.5px solid rgba(60, 60, 67, 0.08); box-shadow: rgba(0, 0, 0, 0.04) 0px 2px 12px; gap: 18px;"><div class="space-y-1"><h2 class="text-[20px] font-semibold text-[#1c1c1e] tracking-tight leading-[1.35]" style="font-family: -apple-system, 'SF Pro Display', 'PingFang SC', sans-serif;">小周的周报有 2 处和例会不一样</h2></div><div class="flex flex-col gap-3 pt-0.5"><div class="flex items-start gap-2.5"><div class="w-2 h-2 rounded-full mt-2 shrink-0" style="background-color: #3F6EE8;"></div><p class="text-[15px] leading-[23px] text-[#1c1c1e]"><span class="font-medium text-[#1c1c1e]">支付对接：</span><span class="text-[#3a3a3c]">他写“本周完成”，例会定的是下周三</span></p></div><div class="flex items-start gap-2.5"><div class="w-2 h-2 rounded-full mt-2 shrink-0" style="background-color: #3F6EE8;"></div><p class="text-[15px] leading-[23px] text-[#3a3a3c]">漏了“压测报告”</p></div></div><div class="p-3.5 border" style="background-color: #F8F9FE; border-color: rgba(63, 110, 232, 0.15); border-radius: 14px;"><div class="flex items-start gap-2.5"><p class="text-[14px] leading-[22px] select-text" style="color: #2446A6;"><span class="font-medium" style="color: #3F6EE8;">建议回复：</span>“支付对接按例会改成下周三完成；另外补上压测报告。”</p></div></div><div class="w-full h-[0.5px] mt-0.5" style="background-color: rgba(60, 60, 67, 0.1);"></div><div class="flex items-center justify-between pt-0.5"><a class="inline-flex items-center font-normal active:opacity-60 transition-opacity gap-0.5 text-[13px] group" href="#" style="color: #3F6EE8;"><span class="group-hover:underline underline-offset-2">出处：周三例会纪要</span><span class="material-symbols-outlined text-[14px] transition-transform group-hover:translate-x-0.5" style="font-variation-settings: 'wght' 300;">chevron_right</span></a><span class="text-[12px] tracking-normal" style="color: rgba(60, 60, 67, 0.6);">内容由 AI 生成</span></div></section>

<div class="px-3 pt-5 flex items-center justify-center gap-1.5 text-on-surface-variant/65 text-body-sm font-normal"><span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'wght' 300; color: rgba(60, 60, 67, 0.55);">swipe_right</span><span class="tracking-tight text-[13px]" style="color: rgba(60, 60, 67, 0.6); font-family: -apple-system, 'SF Pro Text', 'PingFang SC', sans-serif;">向右滑动可暂存至稍后处理</span></div>
</div>

<span class="font-headline-sm text-[16.5px] text-white tracking-wide font-semibold drop-shadow-sm">

        </span>
</button>

<div class="pt-3 pb-1.5">
<button class="text-primary-container font-medium text-[14px] tracking-wide py-1 px-3 rounded-full active:scale-[0.96] active:opacity-60 active:brightness-95 transition-all duration-150 ease-out select-none inline-flex items-center justify-center" style="color: rgb(63, 110, 232); font-weight: 500; font-family: -apple-system, &quot;SF Pro Text&quot;, &quot;PingFang SC&quot;, sans-serif; background-color: rgba(63, 110, 232, 0.06); border: 0.5px solid rgba(63, 110, 232, 0.12);" type="button">改一改 · 这不算问题</button>

<div class="w-full flex justify-center pt-2 pb-1">
<div class="w-[134px] h-[5px] bg-[#1d1b18]/80 rounded-full"></div>
</div>
</footer>

<script>
    // Lightweight tactile feedback for iOS active feeling
    document.querySelectorAll('button, a').forEach(el => {
      el.addEventListener('touchstart', () => {}, {passive: true});
    });

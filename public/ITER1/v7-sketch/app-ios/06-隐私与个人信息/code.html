<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>隐私与个人信息</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            iosBg: '#F2F2F7',
            cardBg: '#FFFFFF',
            iosPrimary: '#3F6EE8',
            iosDestructive: '#FF3B30',
            iosText: '#000000',
            iosSubtext: '#8E8E93',
            iosSectionHeader: '#6C6C70',
            iosSeparator: '#E5E5EA',
            iosActionGray: '#8E8E93'
          }
        }
      }
    };
  </script>
<style>
    * {
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #F2F2F7;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .ios-cell:active {
      background-color: #F2F2F7;
    }
  </style>
<style id="ios-fix">
body *:not(.material-symbols-outlined){font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans SC",sans-serif !important}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24 !important}
</style>
</head>
<body class="bg-[#F2F2F7] text-[#000000] flex justify-center min-h-screen">
<!-- iPhone Pure iOS Screen Container (No mock device frame/border) -->
<div class="w-full max-w-[390px] min-h-screen flex flex-col bg-[#F2F2F7] relative">
<!-- 1. iOS Status Bar -->
<header class="w-full pt-3 px-7 flex justify-between items-center bg-[#F2F2F7] z-30 select-none">
<!-- Time -->
<span class="text-[15px] font-semibold tracking-tight text-black">16:00</span>
<!-- Dynamic Island Capsule -->
<div class="w-[124px] h-[34px] bg-black rounded-full flex items-center justify-between px-3 -mt-1">
<div class="w-2.5 h-2.5 rounded-full bg-[#1A1A1A]"></div>
<div class="w-3 h-3 rounded-full bg-[#1A1A1A]"></div>
</div>
<!-- System Icons: Signal, Wi-Fi, Battery -->
<div class="flex items-center space-x-1.5 text-black">
<svg class="w-4 h-3.5 fill-current" viewBox="0 0 17 11">
<rect height="3" rx="0.5" width="2.5" x="0" y="8"></rect>
<rect height="5.5" rx="0.5" width="2.5" x="4.5" y="5.5"></rect>
<rect height="8" rx="0.5" width="2.5" x="9" y="3"></rect>
<rect height="11" rx="0.5" width="2.5" x="13.5" y="0"></rect>
</svg>
<svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 16 12">
<path d="M8 2.5C10.8 2.5 13.3 3.6 15.1 5.4L16 4.5C13.9 2.4 11.1 1 8 1C4.9 1 2.1 2.4 0 4.5L0.9 5.4C2.7 3.6 5.2 2.5 8 2.5ZM8 6.5C9.7 6.5 11.3 7.2 12.4 8.4L13.3 7.5C11.9 6.1 10.1 5.2 8 5.2C5.9 5.2 4.1 6.1 2.7 7.5L3.6 8.4C4.7 7.2 6.3 6.5 8 6.5ZM8 10.2C8.7 10.2 9.2 10.7 9.2 11.4C9.2 12.1 8.7 12.6 8 12.6C7.3 12.6 6.8 12.1 6.8 11.4C6.8 10.7 7.3 10.2 8 10.2Z"></path>
</svg>
<div class="w-6 h-[11.5px] border border-black/80 rounded-[3.5px] p-[1px] flex items-center relative">
<div class="h-full w-[82%] bg-black rounded-[2px]"></div>
<div class="absolute -right-[3px] top-[2.5px] w-[2px] h-[4.5px] bg-black/80 rounded-r-[1px]"></div>
</div>
</div>
</header>
<!-- 2. Navigation Bar -->
<nav class="sticky top-0 z-20 bg-[#F2F2F7]/90 backdrop-blur-md px-4 h-[44px] flex items-center justify-between">
<!-- Back button -->
<button class="flex items-center text-[#3F6EE8] active:opacity-60 transition-opacity -ml-1 text-[17px] font-normal" type="button">
<svg class="w-[20px] h-[20px] stroke-current stroke-[2.4] fill-none -mr-0.5" viewBox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="">我的</span>
</button>
<!-- Center Title -->
<h1 class="text-[17px] font-semibold text-black tracking-tight text-center truncate max-w-[200px]">
        隐私与个人信息
      </h1>
<!-- Balanced spacer (no extra button) -->
<div class="w-12"></div>
</nav>
<!-- 3. Scrollable Content (Inset Grouped) -->
<main class="flex-1 px-4 pt-3 pb-8 space-y-6">
<!-- 分组 1: 我了解的你 · 工作 -->
<section>
<h2 class="text-[13px] text-[#6C6C70] px-4 mb-1.5 tracking-normal font-normal">
          我了解的你 · 工作
        </h2>
<div class="bg-white rounded-[18px] overflow-hidden shadow-[0_0.5px_1px_rgba(0,0,0,0.04)]">
<!-- Row 1 -->
<div class="ios-cell transition-colors px-4 py-3.5 flex items-center justify-between">
<div class="pr-3 flex-1 min-w-0">
<p class="text-[16px] text-black tracking-tight leading-snug">给王总的汇报：先说结论，一页以内</p>
<p class="text-[13px] text-[#8E8E93] mt-1">来自：你发出的周报</p>
</div>
<button class="text-[#8E8E93] text-[15px] font-normal py-1 px-1 shrink-0 active:opacity-60 transition-opacity" type="button">
              不对
            </button>
</div>
<!-- Divider -->
<div class="ml-4 h-[0.5px] bg-[#E5E5EA]"></div>
<!-- Row 2 -->
<div class="ios-cell transition-colors px-4 py-3.5 flex items-center justify-between">
<div class="pr-3 flex-1 min-w-0">
<p class="text-[16px] text-black tracking-tight leading-snug">每周五 18:00 前交团队周报</p>
<p class="text-[13px] text-[#8E8E93] mt-1">来自：周三例会纪要</p>
</div>
<button class="text-[#8E8E93] text-[15px] font-normal py-1 px-1 shrink-0 active:opacity-60 transition-opacity" type="button">
              不对
            </button>
</div>
</div>
</section>
<!-- 分组 2: 健康 -->
<section>
<h2 class="text-[13px] text-[#6C6C70] px-4 mb-1.5 tracking-normal font-normal">
          健康
        </h2>
<div class="bg-white rounded-[18px] overflow-hidden shadow-[0_0.5px_1px_rgba(0,0,0,0.04)]">
<!-- Row 1 -->
<div class="ios-cell transition-colors px-4 py-3.5 flex items-center justify-between">
<div class="pr-3 flex-1 min-w-0">
<p class="text-[16px] text-black tracking-tight leading-snug">每年 11 月做一次体检</p>
<p class="text-[13px] text-[#8E8E93] mt-1">来自：去年的体检预约截图</p>
</div>
<button class="text-[#8E8E93] text-[15px] font-normal py-1 px-1 shrink-0 active:opacity-60 transition-opacity" type="button">
              不对
            </button>
</div>
</div>
<!-- 提示文案 -->
<p class="text-[13px] text-[#8E8E93] px-4 mt-2 leading-relaxed">
          这些是我为了把事办好而记下的。左滑可删掉。<a class="text-[#3F6EE8] active:opacity-60" href="#">查看全部（含还没确认的）</a>
</p>
</section>
<!-- 分组 3: 不按你的情况定制 -->
<section>
<h2 class="text-[13px] text-[#6C6C70] px-4 mb-1.5 tracking-normal font-normal">
          不按你的情况定制
        </h2>
<div class="bg-white rounded-[18px] overflow-hidden shadow-[0_0.5px_1px_rgba(0,0,0,0.04)]">
<!-- Row 1: 通用模式 iOS Toggle (关闭态) -->
<div class="ios-cell transition-colors px-4 py-3 flex items-center justify-between min-h-[48px]">
<span class="text-[16px] text-black">通用模式</span>
<label class="relative inline-flex items-center cursor-pointer select-none">
<input class="sr-only peer" type="checkbox">
<div class="w-[51px] h-[31px] bg-[#E9E9EB] peer-checked:bg-[#34C759] rounded-full transition-colors duration-200 ease-in-out relative shadow-inner">
<div class="w-[27px] h-[27px] bg-white rounded-full absolute top-[2px] left-[2px] shadow-[0_2px_4px_rgba(0,0,0,0.2)] transition-transform duration-200 ease-in-out peer-checked:translate-x-[20px]"></div>
</div>
</label>
</div>
<!-- Divider -->
<div class="ml-4 h-[0.5px] bg-[#E5E5EA]"></div>
<!-- Row 2: 敏感类别 -->
<div class="ios-cell transition-colors px-4 py-3.5 flex items-center justify-between min-h-[48px] cursor-pointer">
<span class="text-[16px] text-black truncate pr-2">健康、财务、孩子、位置、人脸</span>
<div class="flex items-center space-x-1 shrink-0">
<span class="text-[15px] text-[#8E8E93]">4 项开</span>
<svg class="w-4 h-4 text-[#C7C7CC] stroke-current stroke-[2.2] fill-none" viewBox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
</div>
</section>
<!-- 分组 4: 客服查看记录 -->
<section>
<h2 class="text-[13px] text-[#6C6C70] px-4 mb-1.5 tracking-normal font-normal">
          客服查看记录
        </h2>
<div class="bg-white rounded-[18px] overflow-hidden shadow-[0_0.5px_1px_rgba(0,0,0,0.04)]">
<div class="px-4 py-3.5 flex items-center justify-between min-h-[48px]">
<span class="text-[16px] text-black">没有授权</span>
</div>
</div>
<p class="text-[13px] text-[#8E8E93] px-4 mt-2 leading-relaxed">
          除非你授权，我们工作人员看不到你的记录
        </p>
</section>
<!-- 分组 5: 数据操作 -->
<section class="pt-1">
<div class="bg-white rounded-[18px] overflow-hidden shadow-[0_0.5px_1px_rgba(0,0,0,0.04)]">
<!-- 导出全部数据 (#3F6EE8) -->
<button class="w-full text-left ios-cell transition-colors px-4 py-3.5 flex items-center active:bg-[#F2F2F7]" type="button">
<span class="text-[16px] text-[#3F6EE8] font-normal">导出全部数据</span>
</button>
<!-- Divider -->
<div class="ml-4 h-[0.5px] bg-[#E5E5EA]"></div>
<!-- 忘掉我 (#FF3B30) -->
<button class="w-full text-left ios-cell transition-colors px-4 py-3.5 flex items-center active:bg-[#F2F2F7]" type="button">
<span class="text-[16px] text-[#FF3B30] font-normal">忘掉我</span>
</button>
</div>
</section>
</main>
<!-- iOS Home Indicator -->
<footer class="w-full pb-2 pt-1 flex justify-center items-center select-none bg-[#F2F2F7]">
<div class="w-[134px] h-[5px] bg-black/80 rounded-full"></div>
</footer>
</div>


</body></html>

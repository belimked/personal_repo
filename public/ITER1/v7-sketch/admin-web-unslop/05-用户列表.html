<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小禾后台 · 用户</title><link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="app">
  <div data-side="用户"></div>
  <main class="main"><div class="wrap">
    <header class="page-head"><h1>用户</h1><span class="meta">5</span>
      <div class="right"><div class="input" style="width:240px;height:36px"><i data-i="search"></i><span class="ph">搜索邮箱、姓名</span></div><button class="btn pri"><i data-i="plus"></i>添加用户</button></div>
    </header>
    <section class="card">
      <table>
        <thead><tr><th style="width:36%">姓名</th><th>状态</th><th>存储</th><th style="text-align:right">最近登录</th></tr></thead>
        <tbody>
          <tr><td>管理员<span class="sub">admin@demo.com</span></td><td><span class="state"><span class="dot ok"></span>正常</span></td><td><span class="num">126 / 500 MB</span><span class="bar"><i style="width:25%"></i></span></td><td class="num" style="text-align:right">刚刚</td></tr>
          <tr><td>Lily<span class="sub">lily@demo.com</span></td><td><span class="state"><span class="dot ok"></span>正常</span></td><td><span class="num">284 / 500 MB</span><span class="bar"><i style="width:57%"></i></span></td><td class="num" style="text-align:right">今天 09:12</td></tr>
          <tr><td>张伟<span class="sub">zhang.wei@demo.com</span></td><td><span class="state"><span class="dot ok"></span>正常</span></td><td><span class="num">612 / 1000 MB</span><span class="bar warn"><i style="width:61%"></i></span></td><td class="num" style="text-align:right">昨天</td></tr>
          <tr><td>陈晨<span class="sub">chen@demo.com</span></td><td><span class="state"><span class="dot off"></span>已禁用</span></td><td><span class="num">45 / 500 MB</span><span class="bar"><i style="width:9%"></i></span></td><td class="num" style="text-align:right">10 月 2 日</td></tr>
          <tr><td>老用户<span class="sub">old.user@demo.com</span></td><td><span class="state"><span class="dot warn"></span>待清除，还剩 25 天</span></td><td><span class="num">210 / 500 MB</span><span class="bar"><i style="width:42%"></i></span></td><td class="num" style="text-align:right">9 月 28 日</td></tr>
        </tbody>
      </table>
    </section>
  </div></main>
</div>
<script src="shell.js"></script>
</body></html>

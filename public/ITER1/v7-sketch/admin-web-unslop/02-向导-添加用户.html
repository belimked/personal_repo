<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小禾后台 · 开始设置</title><link rel="stylesheet" href="admin.css">
<style>
.wiz{max-width:640px}
.wiz .card{padding:24px}
.wiz .card>*+*{margin-top:20px}
.test{display:flex;align-items:center;gap:12px}
.okline{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ok)}
.okline svg{width:16px;height:16px}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:24px}
.pw{display:flex;align-items:center;gap:12px}
.pw .input{flex:1}
.skipped{color:var(--t3)}
</style>
</head>
<body>
<div class="app">
  <div data-side data-setup></div>
  <main class="main">
    <div class="wiz">
      <header class="page-head"><h1>3 步配好，用户就能用</h1></header>
      <div class="steps">
        <div class="done"><i data-i="check"></i>配模型</div>
        <div class="done skipped"><i data-i="skip"></i>邮件发送，已跳过</div>
        <div class="on"><span class="n">3</span>添加用户</div>
      </div>
      <section class="card">
        <div class="grid2">
          <div class="field"><label>登录邮箱</label><div class="input">lily@demo.com</div></div>
          <div class="field"><label>姓名</label><div class="input">Lily</div></div>
        </div>
        <div class="field"><label>初始密码，自动生成</label>
          <div class="pw"><div class="input"><span class="mono">Kx7m-29qa</span></div><button class="btn"><i data-i="copy"></i>复制</button></div>
        </div>
        <p class="hint">系统不开放注册。邮件发送还没配，请把邮箱和初始密码自己发给对方；对方第一次登录时要改密码。</p>
      </section>
      <div class="foot"><button class="btn quiet"><i data-i="plus"></i>再加一个</button><button class="btn pri">完成</button></div>
    </div>
  </main>
</div>
<script src="shell.js"></script>
</body></html>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小禾后台 · 首页</title><link rel="stylesheet" href="admin.css">
<style>
.done{padding:40px 32px}
.done .ic{width:44px;height:44px;border-radius:22px;border:1.5px solid var(--ok);color:var(--ok);display:grid;place-items:center}
.done .ic svg{width:22px;height:22px}
.done h2{font-size:22px;line-height:28px;font-weight:500;margin-top:20px}
.done p{color:var(--t2);margin-top:8px}
</style>
</head>
<body>
<div class="app">
  <div data-side="首页"></div>
  <main class="main"><div class="wrap">
    <header class="page-head"><h1>要你处理</h1><span class="meta">0 件</span></header>
    <section class="card done">
      <span class="ic"><i data-i="check"></i></span>
      <h2>都处理好了</h2>
      <p>系统正常，有新情况会出现在这里</p>
    </section>
    <section class="card status">
        <div><span>用户</span><b>5 人，1 禁用</b></div>
        <div><span>今天调用</span><b>1,284 次</b></div>
        <div><span>存储</span><b>1.3 / 5 GB</b></div>
        <div><span>模型</span><b><span class="dot ok"></span>主用正常</b></div>
      </section>
  </div></main>
</div>
<script src="shell.js"></script>
</body></html>

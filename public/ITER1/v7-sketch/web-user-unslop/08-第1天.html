<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小禾 · 第 1 天</title><link rel="stylesheet" href="web.css">
</head>
<body>
<div data-top="管家"></div>
<main><div class="col">
    <header class="head"><h1 class="title">明早 8:00 给你第一份简报</h1><p class="lede">我每天替你把事情理好，你只要花几分钟过一遍</p></header>
    <article class="card task">
      <h2>先接入工作邮箱</h2>
      <p style="color:var(--t2);margin-top:8px">接好后，收件箱会先分好类，下属的周报会单独挑出来</p>
      <div class="foot"><span class="src" style="color:var(--t3)"><i data-i="shield"></i>只读，随时可以断开</span></div>
    </article>
    <div class="actions"><button class="btn btn-primary" style="flex:7"><i data-i="mail"></i>接入邮箱</button><button class="btn btn-second" style="flex:3"><i data-i="msg"></i>说一句</button></div>
    <p class="note">先不接，<a class="src" href="#" style="font-size:13px">拖一份文件进来试试</a></p>
</div></main>
<script src="shell.js"></script>

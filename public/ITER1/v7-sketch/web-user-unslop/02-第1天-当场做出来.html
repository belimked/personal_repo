<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小禾 · 管家</title><link rel="stylesheet" href="web.css">
</head>
<body>
<div class="app">
<div data-side="管家"></div>
<div class="main">
  <header class="bar"><h1>管家</h1><div class="ctx"><span class="tag">演示</span>苏晴 · 第 1 天 · 第一次打开</div></header>
  <main class="wrap">
    <div class="msg me"><div class="bub">秋假带孩子出去玩</div></div>
    <div style="margin-top:24px">
    <article class="pc">
      <div class="pc-lead">你说“秋假带孩子出去玩”，我先做好了这个</div>
      <div class="pc-meta">出行 <span class="depth">骨架</span></div>
      <h3>秋假去哪：三个短途去处</h3>
      <p class="hint">先给你个大概，展开看完整版</p>
      <div class="body">从深圳出发 3～4 天：长沙（高铁 3 小时，历史博物馆）、潮汕（美食、古城）、桂林阳朔（山水、骑行）。</div>
      <div class="expand"><button class="cb">展开看完整版<i data-i="down"></i></button></div>
      
      <div class="because">因为你说想秋假带孩子出去玩，从深圳出发</div>
      
      <div class="ask"><div class="q"><i data-i="msg"></i>打算玩几天？</div><div class="opts"><button class="cb">两三天</button><button class="cb">四五天</button><button class="cb">一周左右</button></div></div>
      <div class="more"><span class="lbl">还可以帮你</span><button class="cb">交通怎么走</button><button class="cb">按孩子年龄挑景点</button></div>
      <div class="pc-foot"><button class="forget r">这个别记</button></div>
    </article>
    </div>
  </main>
  <div class="dock"><div class="dock-in">
    
    <div class="composer"><button class="ib" title="带上文件（同时存进资料）"><i data-i="clip"></i></button><span class="ph">吩咐一声…</span><button class="ib" disabled title="按住说话（App 版）"><i data-i="mic"></i></button><button class="ib send" title="发送"><i data-i="send"></i></button></div>
    <p class="tip">Enter 发送，Shift + Enter 换行；带上的文件会同时存进“交给我的资料”</p>
  </div></div>
</div>
</div>
<script src="shell.js"></script>
</body></html>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小禾 · 管家</title><link rel="stylesheet" href="web.css">
</head>
<body>
<div class="app">
<div data-side="管家"></div>
<div class="main">
  <header class="bar"><h1>管家</h1><div class="ctx"><span class="tag">演示</span>苏晴 · 第 1 天 · 第一次打开</div></header>
  <main class="wrap">
    <div class="msg me"><div class="bub">下周家长会要准备什么</div></div>
    <div style="margin-top:24px">
    <article class="pc">
      <div class="pc-lead">你说“下周家长会要准备什么”，我先做好了这个</div>
      <div class="pc-meta">孩子 <span class="depth full">一步到位</span></div>
      <h3>家长会准备：要带的、要问的</h3>
      
      <div class="body">要带：签字页、错题本。<br>要问：数学错题多的原因、小升初的安排、课后托管时间。</div>
      
      
      <div class="because">因为你说下周要开家长会</div>
      
      <div class="ask"><div class="q"><i data-i="msg"></i>孩子上几年级？</div><div class="opts"><button class="cb" disabled>小学低年级</button><button class="cb on"><i data-i="check"></i>小学高年级</button><button class="cb" disabled>初中</button></div>
        <div class="consent"><div class="q"><i data-i="lock"></i>要记下孩子的信息，先问你一声</div>
          <p>孩子的年级这类信息，只用来帮你准备学校的事，不给别人看，也不用来训练模型。不满 14 岁孩子的信息需要你作为监护人单独同意，你随时可以在“我了解的你”里撤回。</p>
          <div class="acts"><button class="btn btn-primary">同意</button><button class="btn btn-line">不同意，结果照样给我</button></div></div></div>
      <div class="more"><span class="lbl">还可以帮你</span><button class="cb">设个提醒</button><button class="cb">整理要问老师的问题</button></div>
      <div class="pc-foot"><button class="forget r">这个别记</button></div>
    </article>
    </div>
  </main>
  <div class="dock"><div class="dock-in">
    
    <div class="composer"><button class="ib" title="带上文件（同时存进资料）"><i data-i="clip"></i></button><span class="ph">吩咐一声…</span><button class="ib" disabled title="按住说话（App 版）"><i data-i="mic"></i></button><button class="ib send" title="发送"><i data-i="send"></i></button></div>
    <p class="tip">Enter 发送，Shift + Enter 换行；带上的文件会同时存进“交给我的资料”</p>
  </div></div>
</div>
</div>
<script src="shell.js"></script>
</body></html>

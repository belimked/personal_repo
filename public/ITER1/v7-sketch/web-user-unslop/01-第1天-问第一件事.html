<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小禾 · 管家</title><link rel="stylesheet" href="web.css">
</head>
<body>
<div class="app">
<div data-side="管家"></div>
<div class="main">
  <header class="bar"><h1>管家</h1><div class="ctx"><span class="tag">演示</span>苏晴 · 第 1 天 · 第一次打开</div></header>
  <main class="wrap" style="padding-top:120px">
    <h2 class="title">这周最想搞定的一件事是什么？</h2>
    <p class="lede">说一件就行，我当场先帮你做出来。点个例子，或者直接在下面输入。</p>
    <div class="more" style="margin-top:24px">
      <a class="cb" href="02-第1天-当场做出来.html" style="height:40px;padding:0 16px;font-size:15px">秋假带孩子出去玩</a>
      <a class="cb" href="03-第1天-孩子信息先问.html" style="height:40px;padding:0 16px;font-size:15px">下周家长会要准备什么</a>
      <button class="cb" style="height:40px;padding:0 16px;font-size:15px">把这周的周报写了</button>
      <button class="cb" style="height:40px;padding:0 16px;font-size:15px">妈妈生日送什么</button>
    </div>
  </main>
  <div class="dock"><div class="dock-in">
    
    <div class="composer"><button class="ib" title="带上文件（同时存进资料）"><i data-i="clip"></i></button><span class="ph">吩咐一声…</span><button class="ib" disabled title="按住说话（App 版）"><i data-i="mic"></i></button><button class="ib send" title="发送"><i data-i="send"></i></button></div>
    <p class="tip">Enter 发送，Shift + Enter 换行；带上的文件会同时存进“交给我的资料”</p>
  </div></div>
</div>
</div>
<script src="shell.js"></script>
</body></html>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小禾 · 管家面板</title><link rel="stylesheet" href="web.css">
<style>
.scrim{position:fixed;inset:56px 0 0 0;background:rgba(28,28,30,.12);z-index:4}
.panel{position:fixed;top:60px;left:24px;width:400px;z-index:6;background:var(--card);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 8px 24px rgba(0,0,0,.08);padding:8px 0}
.search{display:flex;align-items:center;gap:8px;height:44px;margin:4px 12px 8px;padding:0 12px;border-radius:10px;background:var(--bg);color:var(--t3)}
.search .kbd{margin-left:auto}
.panel .row{padding:8px 20px;min-height:52px}
.panel .card,.panel{overflow:hidden}
.panel .row:first-of-type::before{display:none}
</style>
</head>
<body>
<div data-top="管家" data-open></div>
<main>
  <div class="col">
    <header class="head"><h1 class="title">3 件事等你定</h1><p class="lede">都已备好办法，过一遍约 2 分钟</p></header>
    <section class="card" aria-label="今日简报">
      <div class="brief-top"><span>周五简报</span><span class="mono">16:00</span></div>
      <a class="item" href="02-逐件过.html"><span class="no mono">01</span><div class="main"><div class="h">小周的周报</div><div class="s">2 处和例会不一样，意见已写好</div></div><i data-i="right" class="chev"></i></a>
      <a class="item" href="#"><span class="no mono">02</span><div class="main"><div class="h">客户问能否提前上线</div><div class="s">建议不整体提前，回复已拟好</div></div><i data-i="right" class="chev"></i></a>
      <a class="item" href="#"><span class="no mono">03</span><div class="main"><div class="h">团队周报</div><div class="s">已写好，确认就发</div></div><span class="meta mono">18:00 前</span></a>
    </section>
    <div class="actions"><a class="btn btn-primary" style="flex:7" href="02-逐件过.html">开始<span class="kbd">Enter</span></a><button class="btn btn-second" style="flex:3"><i data-i="msg"></i>说一句</button></div>
    <p class="note">另有 <span class="num">7</span> 件我在办，不用你管</p>
  </div>
</main>
<div class="scrim"></div>
<section class="panel" aria-label="管家">
  <label class="search"><i data-i="search"></i>搜索资料、事情、说过的话<span class="kbd">Ctrl K</span></label>
  <a class="row" href="#"><span class="ic"><i data-i="cal"></i></span><span class="label">日程</span><span class="value">今天 <span class="num">2</span> 个会</span><i data-i="right" class="chev"></i></a>
  <a class="row" href="#"><span class="ic"><i data-i="hist"></i></span><span class="label">历史事情</span><span class="value">本周办完 <span class="num">12</span> 件</span><i data-i="right" class="chev"></i></a>
  <a class="row" href="#"><span class="ic"><i data-i="folder"></i></span><span class="label">交给我的资料</span><span class="value"><span class="num">86</span> 份</span><i data-i="right" class="chev"></i></a>
  <a class="row" href="#"><span class="ic"><i data-i="upload"></i></span><span class="label">交资料</span><span class="value">拖进来、文件、链接</span><i data-i="right" class="chev"></i></a>
  <a class="row" href="#"><span class="ic"><i data-i="gear"></i></span><span class="label">设置</span><span class="value">主动服务开</span><i data-i="right" class="chev"></i></a>
</section>
<script src="shell.js"></script>
</body></html>

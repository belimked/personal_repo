<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小禾 · 看原文</title><link rel="stylesheet" href="web.css">
<style>
.split{display:flex;justify-content:flex-start;padding-left:max(48px,calc(50vw - 640px))}
.split .col{margin:0}
.drawer{position:fixed;top:56px;right:0;bottom:0;width:480px;background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column}
.drawer header{height:64px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--line)}
.drawer h3{font-size:17px;line-height:24px;font-weight:500}
.drawer .x{margin-left:auto;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--t2)}
.drawer .x:hover{background:var(--raised)}
.drawer .meta{padding:16px 24px 0;font-size:13px;color:var(--t3)}
.drawer .doc{padding:16px 24px;line-height:26px}
.drawer .doc p+p{margin-top:16px}
.drawer .doc .k{color:var(--t2)}
.drawer mark{background:var(--hl);color:var(--t1);border-radius:4px;padding:2px 4px}
.drawer .tip{margin:0 24px;padding:12px 16px;border-radius:8px;background:var(--bg);font-size:13px;line-height:20px;color:var(--t2)}
</style>
</head>
<body>
<div data-top="管家"></div>
<main class="split"><div class="col">
    <div class="prog"><span class="num">1 / 3</span><span class="seg"><span class="on"></span><span></span><span></span></span>
      <button class="later">稍后<span class="kbd">L</span></button></div>
    <article class="card task">
      <h2>小周的周报有 2 处和例会不一样</h2>
      <ul class="diff">
        <li><span class="k">支付对接</span><span>他写“本周完成”，例会定的是<b>下周三</b></span></li>
        <li><span class="k">漏项</span><span>没写“压测报告”</span></li>
      </ul>
      <div class="reply"><div class="k">建议回复</div><p>支付对接按例会改成下周三完成；另外补上压测报告。</p></div>
      <div class="foot"><a class="src" href="#"><i data-i="doc"></i>出处：周三例会纪要</a><span class="ai">内容由 AI 生成</span></div>
    </article>
    <div class="actions"><a class="btn btn-primary" style="flex:1" href="04-发了吗.html">确认并发给小周…</a></div>
    <div class="secondary"><button class="btn-text">改一改</button><button class="btn-text">复制</button><button class="btn-text">这不算问题</button><button class="btn-text">下一件<span class="kbd">→</span></button></div>
</div></main>
<aside class="drawer">
  <header><h3>小周的周报，原文</h3><button class="x" aria-label="关闭"><i data-i="x"></i></button></header>
  <div class="meta"><span class="mono">11 月 6 日 10:12</span>，来自邮件</div>
  <div class="doc">
    <p><span class="k">本周完成</span><br>1. 会员积分接口联调<br>2. <mark>支付对接本周完成</mark><br>3. 订单页性能优化</p>
    <p><span class="k">下周计划</span><br>1. 积分商城上线准备</p>
  </div>
  <p class="tip">标出的是和周三例会纪要不一致的地方；“压测报告”原文里没有提到</p>
</aside>
<script src="shell.js"></script>
</body></html>

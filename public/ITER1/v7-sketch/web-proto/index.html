<!doctype html><html lang="zh-CN"><head><link rel="icon" href="data:,"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小禾 · 登录</title><link rel="stylesheet" href="user/web.css"><link rel="stylesheet" href="user/proto.css"></head><body class="login-page"><main class="login-card card"><div class="brand"><span class="mark">禾</span>小禾</div><h1 class="title">欢迎回来</h1><p class="lede">登录后，接着把事情交给小禾。</p><form id="login"><label>邮箱<input class="input" id="email" type="email" required autocomplete="username" placeholder="请输入邮箱"></label><label>密码<input class="input" id="password" type="password" required autocomplete="current-password" placeholder="请输入密码"></label><p id="error" class="error" role="alert"></p><button class="btn btn-primary" type="submit">登录</button></form><div class="login-demo small faint">演示账号（密码均为 demo1234）<div><button class="tbtn" data-email="lily@demo.com">填入一般用户</button><button class="tbtn" data-email="admin@demo.com">填入管理员</button></div></div></main><script>document.querySelectorAll('[data-email]').forEach(b=>b.onclick=()=>{email.value=b.dataset.email;password.value='demo1234';error.textContent=''});document.querySelector('#login').onsubmit=e=>{e.preventDefault();let v=email.value.trim().toLowerCase(),role=v==='lily@demo.com'?'user':v==='admin@demo.com'?'admin':null;if(!role||password.value!=='demo1234'){document.querySelector('#error').textContent='邮箱或密码不正确';return}localStorage.setItem('v7proto.session',JSON.stringify({role,email:v}));location.href=role==='user'?'user/home.html':'admin/home.html'};</script></body></html>

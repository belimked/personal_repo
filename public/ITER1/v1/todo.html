<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>待办详情 · 个人日常助手</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div id="page">
  <div class="row" style="margin-bottom:12px"><a href="todos.html">← 返回待办列表</a></div>
  <div id="view"></div>
</div>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
if (PA.mount({ page: "todos", title: "待办详情" })) {
  const { state, esc, save, fmtDate, toast, log } = PA;
  const t = PA.todoById(PA.qs("id"));
  if (!t) view.innerHTML = '<div class="card empty">待办不存在</div>';
  else {
    const render = () => {
      const src = t.sourceFile && PA.fileById(t.sourceFile);
      view.innerHTML = `
      <div class="card">
        <div class="card-head"><h2>${esc(t.title)}</h2><span class="badge ${t.status === "open" ? "blue" : t.status === "done" ? "green" : ""}">${PA.STATUS_LABEL[t.status]}</span><span class="badge">${PA.SOURCE_LABEL[t.source]}</span><span class="spacer"></span>
          ${t.status === "open" ? '<button class="btn" data-a="done">✓ 标记完成</button>' : t.status === "done" ? '<button class="btn" data-a="reopen">改回未完成</button>' : ""}
          ${t.status === "archived" ? '<button class="btn" data-a="reopen">恢复</button>' : '<button class="btn danger" data-a="archive">归档</button>'}</div>
        <div class="grid2">
          <div class="field"><label>待办内容</label><input class="input" data-k="title" value="${esc(t.title)}"></div>
          <div class="field"><label>地点</label><input class="input" data-k="location" value="${esc(t.location)}"></div>
          <div class="field"><label>日期</label><input class="input" type="date" data-k="date" value="${t.date || ""}"></div>
          <div class="field"><label>时间</label><input class="input" type="time" data-k="time" value="${t.time || ""}"></div>
        </div>
        <div class="field"><label>备注</label><textarea class="input" rows="3" data-k="notes">${esc(t.notes)}</textarea></div>
        <div class="row"><button class="btn primary" data-a="save">保存修改</button><span class="hint">创建于 ${esc(t.createdAt)} · 来源：${PA.SOURCE_LABEL[t.source]}${src ? `（<a href="files.html?file=${src.id}">${esc(src.name)}</a>）` : ""}</span></div>
      </div>
      ${t.actionItems ? `<div class="card"><div class="card-head"><h3>会议行动项</h3><span class="hint">由会议录音识别，保存为本会议的备注</span></div>
        ${t.actionItems.map((a, i) => `<div class="ai-item"><span class="owner ${a.owner === "我" ? "me" : ""}">${esc(a.owner)}</span><div style="flex:1">${esc(a.text)}${a.due ? ` <span class="muted small">· ${fmtDate(a.due)}</span>` : ""}</div>
          ${a.converted ? `<a class="small" href="todo.html?id=${a.converted}">已转为我的待办 →</a>` : `<button class="btn sm" data-conv="${i}">转为我的待办</button>`}</div>`).join("")}</div>` : ""}
      <div class="card">
        <div class="card-head"><h3>附件（${t.attachments.length}）</h3><span class="hint">附件保存在个人知识库，可被语义查询；同一文件可关联多个待办</span><span class="spacer"></span>
          <button class="btn" data-a="pick">从知识库选择</button><button class="btn primary" data-a="upload">上传新附件</button></div>
        ${t.attachments.length ? `<div class="table-wrap"><table class="table"><tr><th>文件</th><th>大小</th><th>也关联到</th><th></th></tr>${t.attachments.map(PA.fileById).filter(Boolean).map((f) => {
          const others = PA.linkedTodos(f.id).filter((x) => x.id !== t.id);
          return `<tr><td>${PA.fileIcon(f)} ${esc(f.name)}</td><td>${PA.fmtSize(f.size)}</td><td class="small">${others.length ? others.map((o) => `<a href="todo.html?id=${o.id}">${esc(o.title)}</a>`).join("、") : '<span class="muted">—</span>'}</td>
            <td style="white-space:nowrap">${PA.canPreview(f) ? `<button class="btn sm" data-prev="${f.id}">预览</button> ` : ""}<button class="btn sm" data-dl="${f.id}">下载</button> <button class="btn sm ghost" data-unlink="${f.id}" title="只解除关联，不删除文件">解除关联</button></td></tr>`;
        }).join("")}</table></div>` : '<div class="muted small">暂无附件</div>'}
      </div>`;
      const q = (s) => view.querySelector(s);
      q('[data-a="save"]').onclick = () => { view.querySelectorAll("[data-k]").forEach((i) => (t[i.dataset.k] = i.value.trim())); if (!t.title) { toast("待办内容不能为空"); return; } save(); log("手动更新待办", t.title); PA.updateBadges(); toast("已保存"); render(); };
      const setStatus = (s, msg) => { t.status = s; save(); log("手动更新待办", `${t.title} → ${PA.STATUS_LABEL[s]}`); PA.updateBadges(); toast(msg); render(); };
      q('[data-a="done"]') && (q('[data-a="done"]').onclick = () => setStatus("done", "已标记完成"));
      q('[data-a="reopen"]') && (q('[data-a="reopen"]').onclick = () => setStatus("open", "已恢复为未完成"));
      q('[data-a="archive"]') && (q('[data-a="archive"]').onclick = () => PA.confirmBox("归档待办", "归档后不再出现在待办列表和提醒中，可在“已归档”中查看和恢复。待办不会被删除，附件保留。", () => setStatus("archived", "已归档"), "归档"));
      q('[data-a="upload"]').onclick = () => PA.pickFiles({ todoId: t.id });
      q('[data-a="pick"]').onclick = pickFromKb;
      view.querySelectorAll("[data-prev]").forEach((b) => (b.onclick = () => PA.openPreview(b.dataset.prev)));
      view.querySelectorAll("[data-dl]").forEach((b) => (b.onclick = () => PA.download(PA.fileById(b.dataset.dl))));
      view.querySelectorAll("[data-unlink]").forEach((b) => (b.onclick = () => { t.attachments = t.attachments.filter((x) => x !== b.dataset.unlink); save(); log("手动更新待办", `${t.title} 解除附件关联`); render(); PA.renderPreview(); }));
      view.querySelectorAll("[data-conv]").forEach((b) => (b.onclick = () => {
        const a = t.actionItems[+b.dataset.conv];
        const nt = { id: PA.uid("t"), title: a.text, date: a.due || "", time: "", location: "", notes: `来自会议：${t.title}${a.owner !== "我" ? "（原负责人：" + a.owner + "）" : ""}`, status: "open", source: "meeting", sourceFile: t.sourceFile, attachments: [], createdAt: PA.nowStr() };
        state.todos.push(nt); a.converted = nt.id; save(); log("手动创建待办", "会议行动项转为待办：" + a.text); PA.updateBadges(); toast("已创建待办"); render();
      }));
    };
    function pickFromKb() {
      const files = state.files.filter((f) => f.status === "indexed" && !t.attachments.includes(f.id));
      PA.modal({ title: "从个人知识库选择附件", wide: true,
        body: `<input class="input" id="kb-kw" placeholder="按文件名筛选" style="margin-bottom:10px"><div class="table-wrap" style="max-height:360px"><table class="table" id="kb-tbl">${files.map((f) => `<tr data-name="${esc(f.name)}"><td style="width:30px"><input type="checkbox" value="${f.id}"></td><td>${PA.fileIcon(f)} ${esc(f.name)}</td><td class="small muted">${esc(f.folder)}</td><td class="small muted">${PA.linkedTodos(f.id).length ? "已关联 " + PA.linkedTodos(f.id).length + " 个待办" : ""}</td></tr>`).join("")}</table></div>`,
        onMount: (m) => { m.querySelector("#kb-kw").oninput = (e) => m.querySelectorAll("#kb-tbl tr").forEach((r) => r.classList.toggle("hidden", !r.dataset.name.includes(e.target.value.trim()))); },
        actions: [{ label: "取消" }, { label: "添加", primary: true, onClick: (m) => { const ids = [...m.querySelectorAll("input[type=checkbox]:checked")].map((c) => c.value); t.attachments.push(...ids); save(); log("手动更新待办", `${t.title} 关联 ${ids.length} 个附件`); toast(`已关联 ${ids.length} 个文件`); render(); } }] });
    }
    document.addEventListener("pa:files-changed", render);
    render();
    if (PA.qs("upload")) setTimeout(() => PA.toast("待办已创建，请点击“上传新附件”选择文件"), 300);
  }
}
</script>
</body>
</html>

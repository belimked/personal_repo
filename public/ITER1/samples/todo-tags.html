<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>样例 · 待办标签</title>
<style>
:root {
  --bg: #f5f6f8; --panel: #fff; --border: #e3e6eb; --text: #1f2329; --muted: #6b7280;
  --primary: #2f6fed; --primary-weak: #eaf1ff; --success: #1a9b5a; --success-weak: #e7f6ee;
  --warn: #c27a00; --warn-weak: #fff4dc; --danger: #d43c3c; --danger-weak: #fdeaea;
  --radius: 10px; font-size: 15px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--primary); text-decoration: none; cursor: pointer; }

.top { position: sticky; top: 0; z-index: 40; background: #fff; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; padding: 10px 20px; flex-wrap: wrap; }
.sample-tag { font-size: 12px; color: var(--warn); background: var(--warn-weak); border-radius: 10px; padding: 2px 8px; }
.tabs { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.tabs button { border: 0; background: #fff; padding: 5px 14px; font-size: 14px; }
.tabs button + button { border-left: 1px solid var(--border); }
.tabs button.on { background: var(--primary-weak); color: var(--primary); font-weight: 600; }
.spacer { flex: 1; }
.linkbtn { border: 0; background: none; color: var(--muted); font-size: 13px; padding: 0; }
.linkbtn:hover { color: var(--primary); }

#view { max-width: 1000px; margin: 0 auto; padding: 18px 20px 60px; }
.note { font-size: 13px; color: #4b5563; background: #fffbea; border: 1px solid #f3e3a6; border-radius: 8px; padding: 8px 12px; margin-bottom: 14px; }
.note b { color: var(--text); }
.note ul { margin: 2px 0 0; padding-left: 18px; }
.box { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); }
.ask { display: flex; align-items: center; gap: 8px; background: var(--primary-weak); border: 1px solid #c9d8fb; border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; font-size: 14px; }
.ask b { color: var(--primary); }
.ask input { flex: 1; border: 1px solid #c9d8fb; border-radius: 6px; padding: 5px 10px; background: #fff; }

/* 标签筛选条 */
.filterwrap { padding: 12px 16px 8px; border-bottom: 1px solid var(--border); }
.tagbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
.grp { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.chip { border: 1px solid var(--border); background: #fff; border-radius: 14px; padding: 1px 10px; font-size: 13px; line-height: 24px; white-space: nowrap; }
.chip i { font-style: normal; color: var(--muted); font-size: 12px; margin-left: 2px; }
.chip:hover { border-color: var(--primary); }
.chip.on { background: var(--primary); border-color: var(--primary); color: #fff; }
.chip.on i { color: rgba(255,255,255,.8); }
.chip.all { font-weight: 600; }
.pchip { white-space: nowrap; border: 0; background: none; font-size: 13px; font-weight: 600; color: #374151; padding: 0 2px; border-bottom: 2px solid transparent; }
.pchip:hover { color: var(--primary); }
.pchip.on { color: var(--primary); border-bottom-color: var(--primary); }
.pchip.part { color: var(--primary); border-bottom: 2px dashed #9db8f5; }
.selsum { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 22px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.selsum .s { background: var(--primary-weak); color: var(--primary); border-radius: 10px; padding: 0 4px 0 8px; }
.selsum .s button { border: 0; background: none; color: var(--primary); padding: 0 4px; }
.tagbar.compact { gap: 4px 10px; }
.tagbar.compact .chip { font-size: 12px; line-height: 20px; padding: 0 8px; }
.tagbar.compact .pchip { font-size: 12px; }

/* 左侧标签树 */
.layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 16px; align-items: start; }
.treewrap { position: sticky; top: 70px; }
.tree { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 6px; }
.tree-item { padding: 5px 10px; border-radius: 5px; cursor: pointer; display: flex; gap: 6px; align-items: center; font-size: 14px; user-select: none; }
.tree-item:hover { background: var(--bg); }
.tree-item.active { background: var(--primary-weak); color: var(--primary); }
.tree-item .n { margin-left: auto; color: var(--muted); font-size: 12px; }
.tree-item .caret { width: 14px; flex: none; color: var(--muted); font-size: 10px; text-align: center; }
.tree-item.untagged { color: var(--muted); }
.cb { width: 14px; height: 14px; flex: none; border: 1.5px solid #c3c9d4; border-radius: 3px; background: #fff; position: relative; }
.cb:hover { border-color: var(--primary); }
.cb.on { background: var(--primary); border-color: var(--primary); }
.cb.on::after { content: ""; position: absolute; left: 3px; top: 0; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.cb.part { border-color: var(--primary); }
.cb.part::after { content: ""; position: absolute; left: 2px; right: 2px; top: 4.5px; height: 2px; background: var(--primary); }
.cb-sp { width: 14px; flex: none; }
.treehint { font-size: 12px; color: var(--muted); padding: 8px 4px; }
.treebtn { display: none; }

/* 待办列表 */
.stline { display: flex; gap: 22px; padding: 0 16px; border-bottom: 1px solid var(--border); font-size: 14px; color: var(--muted); }
.stline span { padding: 10px 0; }
.stline span.on { color: var(--primary); border-bottom: 2px solid var(--primary); font-weight: 600; }
.bucket { padding: 6px 16px; background: #f8f9fb; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600; }
.bucket.red { color: var(--danger); }
.bucket i { font-style: normal; color: var(--muted); font-weight: 400; margin-left: 4px; }
.trow { display: flex; align-items: flex-start; gap: 12px; padding: 9px 16px; border-bottom: 1px solid var(--border); }
.trow:last-child { border-bottom: 0; }
.ck { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid #9ca3af; background: #fff; flex-shrink: 0; margin-top: 3px; padding: 0; }
.ck:hover { border-color: var(--success); }
.ck.done { background: var(--success); border-color: var(--success); }
.trow .body { flex: 1; min-width: 0; }
.trow .t { font-size: 15px; }
.trow.done .t { text-decoration: line-through; color: var(--muted); }
.trow .when { font-size: 13px; color: var(--muted); white-space: nowrap; margin-top: 2px; }
.trow .when.red { color: var(--danger); }
.tags { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 3px; }
.tg { display: inline-flex; align-items: center; background: #eef1f5; color: #4b5563; border-radius: 4px; font-size: 12px; padding: 0 6px; line-height: 20px; }
.tg.hit { background: var(--primary-weak); color: var(--primary); }
.tg .x { border: 0; background: none; color: #9ca3af; padding: 0 0 0 4px; font-size: 12px; line-height: 1; display: none; }
.tags.edit .tg .x { display: inline; }
.tg .x:hover { color: var(--danger); }
.addtag { border: 1px dashed #c3c9d4; background: none; color: var(--muted); border-radius: 4px; font-size: 12px; line-height: 18px; padding: 0 6px; }
.addtag:hover { color: var(--primary); border-color: var(--primary); }
@media (hover: hover) { .addtag { visibility: hidden; } .trow:hover .addtag { visibility: visible; } }
.taginput { width: 150px; font-size: 12px; padding: 1px 6px; border: 1px solid var(--primary); border-radius: 4px; }
.lock { font-size: 11px; color: var(--muted); }
.empty { padding: 30px; text-align: center; color: var(--muted); font-size: 14px; }

/* 助手页 */
.chat { display: flex; flex-direction: column; height: calc(100vh - 150px); min-height: 480px; }
.stream { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.msg { display: flex; gap: 10px; align-items: flex-start; }
.msg.me { flex-direction: row-reverse; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: #e9eef6; color: #2c4a7a; display: grid; place-items: center; font-weight: 600; font-size: 14px; flex-shrink: 0; }
.bubble { background: #fff; border: 1px solid var(--border); border-radius: 4px var(--radius) var(--radius) var(--radius); padding: 10px 14px; max-width: min(600px, 86%); }
.msg.me .bubble { background: var(--primary); color: #fff; border-color: var(--primary); border-radius: var(--radius) 4px var(--radius) var(--radius); }
.bubble p { margin: 0; }
.bubble p + * { margin-top: 8px; }
.rcard { border: 1px solid var(--border); border-radius: 8px; background: #fafbfc; overflow: hidden; }
.rcard .rh { font-size: 12px; color: var(--muted); padding: 6px 10px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.rcard .trow { padding: 6px 10px; gap: 10px; background: #fff; }
.rcard .bucket { padding: 3px 10px; font-size: 12px; }
.rcard .rf { font-size: 13px; padding: 6px 10px; border-top: 1px solid var(--border); }
.tip { margin-top: 8px; font-size: 13px; color: var(--muted); border-top: 1px dashed var(--border); padding-top: 6px; }
.typing { color: var(--muted); font-size: 13px; }
.dock { border-top: 1px solid var(--border); padding: 0 16px 14px; position: relative; }
.dockrow { display: flex; align-items: center; gap: 8px; padding: 8px 0; }
.sugs { display: flex; gap: 6px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; }
.sug { flex-shrink: 0; border: 1px solid var(--border); background: #fff; border-radius: 16px; padding: 3px 12px; font-size: 13px; color: #374151; }
.sug:hover { border-color: var(--primary); color: var(--primary); }
.recent { position: relative; flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 16px; border: 1px solid #c9d8fb; background: var(--primary-weak); color: var(--primary); font-size: 14px; font-weight: 600; }
.recent:hover, .recent.on { background: var(--primary); border-color: var(--primary); color: #fff; }
.recent .over { position: absolute; top: -9px; right: -10px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 11px; line-height: 18px; text-align: center; border: 2px solid #fff; box-sizing: content-box; }
.inputrow { display: flex; gap: 8px; }
.inputrow input { flex: 1; border: 1px solid var(--border); border-radius: 20px; padding: 8px 16px; outline: none; }
.inputrow input:focus { border-color: var(--primary); }
.send { border: 0; background: var(--primary); color: #fff; border-radius: 20px; padding: 0 18px; }
.sheet { position: absolute; left: 16px; right: 16px; bottom: 100%; margin-bottom: 4px; background: #fff; border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 28px rgba(15,23,42,.14); padding: 12px 16px 14px; max-height: 62vh; overflow-y: auto; display: none; z-index: 30; }
.sheet.show { display: block; }
.sheet-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.sheet-head .x { border: 0; background: none; font-size: 18px; color: var(--muted); }
.sheet .tagbar { padding: 6px 0 8px; border-bottom: 1px dashed var(--border); }
.sheet .bucket { background: none; border: 0; padding: 8px 0 2px; font-size: 12px; color: var(--muted); }
.sheet .bucket.red { color: var(--danger); }
.sheet .trow { padding: 5px 0; border: 0; }
.sheet-foot { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border); font-size: 13px; color: var(--muted); display: flex; gap: 14px; }

/* 知识库 */
.frow { display: flex; align-items: center; gap: 12px; padding: 9px 16px; border-bottom: 1px solid var(--border); }
.frow:last-child { border-bottom: 0; }
.fico { width: 30px; height: 30px; border-radius: 6px; background: #eef1f5; display: grid; place-items: center; font-size: 11px; color: #4b5563; flex-shrink: 0; text-transform: uppercase; }
.banner { margin: 10px 16px 0; font-size: 13px; background: var(--primary-weak); color: #1e40af; border-radius: 6px; padding: 6px 10px; }

/* 管理标签 */
table.mt { width: 100%; border-collapse: collapse; font-size: 14px; }
.mt th, .mt td { text-align: left; padding: 8px 14px; border-bottom: 1px solid var(--border); }
.mt th { font-size: 12px; color: var(--muted); font-weight: 600; background: #f8f9fb; }
.mt td.n { font-variant-numeric: tabular-nums; color: #374151; }
.mt td.n .z { color: #c3c9d4; }
.mt .ops button { border: 0; background: none; color: var(--primary); font-size: 13px; padding: 0 6px 0 0; }
.mt .ops button.del { color: var(--danger); }
.mt input, .mt select { font-size: 13px; padding: 2px 6px; border: 1px solid var(--border); border-radius: 4px; }
.src { font-size: 12px; border-radius: 4px; padding: 0 6px; }
.src.user { background: var(--success-weak); color: var(--success); }
.src.model { background: #f1ecfb; color: #6d4bb8; }
.src.preset { background: #eef1f5; color: #4b5563; }
.mhead { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.mhead input { border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 14px; }
.btn { border: 1px solid var(--border); background: #fff; border-radius: 6px; padding: 4px 12px; font-size: 14px; }
.btn.pri { background: var(--primary); border-color: var(--primary); color: #fff; }
details.preset { margin-top: 14px; }
details.preset summary { cursor: pointer; font-size: 14px; font-weight: 600; padding: 10px 14px; }
.ptree { padding: 0 14px 12px; font-size: 13px; }
.ptree div { padding: 3px 0; }
.ptree b { display: inline-block; width: 48px; }
.ptree span { display: inline-block; margin: 0 8px 2px 0; color: var(--muted); }
.ptree span.used { color: var(--text); font-weight: 600; }
.ptree span.new::after { content: "新"; font-size: 10px; color: #fff; background: var(--warn); border-radius: 3px; padding: 0 3px; margin-left: 2px; vertical-align: 2px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111827; color: #fff; border-radius: 8px; padding: 8px 16px; font-size: 14px; display: none; z-index: 80; gap: 14px; align-items: center; }
.toast.show { display: flex; }
.toast button { border: 0; background: none; color: #93b4ff; padding: 0; }

@media (max-width: 640px) {
  #view { padding: 12px 10px 60px; }
  .top { padding: 8px 10px; }
  .tagbar { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; }
  .grp { flex-wrap: nowrap; }
  .tagbar > *, .grp > * { flex-shrink: 0; }
  .mt .hide-m { display: none; }
  .layout { grid-template-columns: 1fr; gap: 0; }
  .treewrap { position: static; }
  .treebtn { display: block; width: 100%; text-align: left; border: 1px solid var(--border); background: #fff; border-radius: 8px; padding: 6px 12px; font-size: 14px; margin-bottom: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .treewrap:not(.open) .tree, .treewrap:not(.open) .treehint { display: none; }
  .treewrap.open .tree { margin-bottom: 4px; }
}
</style>
</head>
<body>
<header class="top">
  <b>待办标签 · UI 样例</b>
  <span class="sample-tag">v4 评审 · 第 12 项草案</span>
  <nav class="tabs" id="tabs">
    <button data-v="todos">待办页</button><button data-v="chat">助手页</button><button data-v="kb">知识库</button><button data-v="manage">管理标签</button>
  </nav>
  <span class="spacer"></span>
  <button class="linkbtn" id="reset">重置演示数据</button>
</header>
<main id="view"></main>
<div class="toast" id="toast"></div>
<datalist id="alltags"></datalist>

<script>
const KEY = "demo_todo_tags_v2";
const NONE = "__none__";
const TODAY = "2026-10-28";
const WD = "日一二三四五六";
const pad = (n) => String(n).padStart(2, "0");
const dt = (s) => new Date(s + "T00:00:00");
const addDays = (s, n) => { const x = dt(s); x.setDate(x.getDate() + n); return `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}`; };
const fmtDate = (s) => `${s.slice(5)} 周${WD[dt(s).getDay()]}`;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const PRESET = [
  ["工作", ["会议", "报告", "方案", "合同协议", "模板", "项目资料", "出差"]],
  ["生意", ["客户", "供应商", "订单", "进货库存", "员工", "资质证照"]],
  ["学习", ["课程", "考试", "论文", "读书笔记", "证书"]],
  ["求职", ["简历", "面试", "录用通知"]],
  ["财务", ["账单", "发票报销", "税务", "理财", "工资社保"]],
  ["家庭", ["孩子教育", "老人照护", "宠物", "菜谱", "家庭账本", "人情往来"]],
  ["生活", ["缴费", "健康医疗", "证件", "保险", "房屋租住", "出行旅游", "照片"]],
  ["资料", ["视频", "收藏", "参考"]],
];
const NEW_PRESET = new Set(["工作/出差", "家庭/人情往来", "生活/缴费"]);
const PRESET_SET = new Set(PRESET.flatMap(([p, cs]) => cs.map((c) => `${p}/${c}`)));

const seed = () => ({
  files: [
    { id: "f1", name: "季度报告草稿.md", tags: ["工作/报告"] },
    { id: "f2", name: "产品评审会议-1020.m4a", tags: ["工作/会议"] },
    { id: "f3", name: "工作周报-10-21.md", tags: ["工作/报告"] },
    { id: "f4", name: "物业费收据-第三季度.pdf", tags: ["生活/缴费"] },
    { id: "f5", name: "电费账单-9月.png", tags: ["生活/缴费"] },
    { id: "f6", name: "家庭开支.csv", tags: ["财务/账单", "家庭/家庭账本"] },
    { id: "f7", name: "体检报告-2026.pdf", tags: ["生活/健康医疗", "生活/保险"] },
    { id: "f8", name: "租房合同扫描件.jpg", tags: ["生活/房屋租住", "合同"] },
    { id: "f9", name: "家庭旅行-三亚.jpg", tags: ["生活/照片", "生活/出行旅游"] },
  ],
  todos: [
    { id: "t1", title: "续交物业费", date: addDays(TODAY, -2), tags: ["生活/缴费"] },
    { id: "t2", title: "交电费", date: addDays(TODAY, -1), tags: ["生活/缴费"] },
    { id: "t3", title: "提交季度报告给王经理", date: addDays(TODAY, -1), time: "17:00", tags: ["工作/报告"] },
    { id: "t4", title: "部门周会", date: TODAY, time: "09:30", tags: ["工作/会议"] },
    { id: "t5", title: "牙医复诊", date: TODAY, time: "14:00", tags: ["生活/健康医疗"] },
    { id: "t6", title: "健身：力量训练", date: TODAY, time: "19:00", tags: ["生活/健康医疗"] },
    { id: "t7", title: "话费充值", date: addDays(TODAY, 1), tags: ["生活/缴费"] },
    { id: "t8", title: "给妈妈买生日礼物", date: addDays(TODAY, 1), tags: ["家庭/人情往来"] },
    { id: "t9", title: "产品评审会", date: addDays(TODAY, 2), time: "15:00", tags: ["工作/会议"] },
    { id: "t10", title: "交燃气费", date: addDays(TODAY, 3), tags: ["生活/缴费"] },
    { id: "t11", title: "交周报", date: addDays(TODAY, 7), tags: ["工作/报告"] },
    { id: "t12", title: "上海出差：拜访客户并开需求会", date: addDays(TODAY, 8), time: "08:30", tags: ["工作/出差", "工作/会议"] },
    { id: "t13", title: "王姐婚礼随礼", date: addDays(TODAY, 11), tags: ["家庭/人情往来"] },
    { id: "t14", title: "车险续保", date: "2026-11-30", period: true, tags: ["生活/保险", "生活/缴费"] },
    { id: "t15", title: "宽带续费", date: addDays(TODAY, 18), tags: ["生活/缴费"] },
    { id: "t16", title: "研究一下基金定投", date: "", tags: ["财务/理财"] },
    { id: "t18", title: "取快递", date: TODAY, tags: [] },
    { id: "t17", title: "交水费", date: addDays(TODAY, -8), tags: ["生活/缴费"], done: true },
  ],
  src: { "合同": "user" },
  custom: [],
  selTodo: [], selKB: [], selPanel: [],
  chat: null, lastTags: [], tipShown: false,
});

let S = JSON.parse(localStorage.getItem(KEY) || "null") || seed();
const save = () => localStorage.setItem(KEY, JSON.stringify(S));
const $ = (id) => document.getElementById(id);
const view = $("view");
let cur = location.hash.slice(1) || "todos";

let toastTimer;
function toast(text, undo) {
  const t = $("toast");
  t.innerHTML = `<span>${esc(text)}</span>${undo ? `<button>撤销</button>` : ""}`;
  t.classList.add("show");
  if (undo) t.querySelector("button").onclick = () => { undo(); t.classList.remove("show"); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 4000);
}

const openTodos = () => S.todos.filter((t) => !t.done);
const usedTags = (items) => [...new Set(items.flatMap((i) => i.tags))];
const allTags = () => [...new Set([...usedTags(S.files), ...usedTags(S.todos), ...S.custom])];
const match = (it, sel) => !sel.size || it.tags.some((t) => sel.has(t)) || (sel.has(NONE) && !it.tags.length);
const tagName = (t) => (t === NONE ? "未打标签" : t);
const tagSrc = (t) => S.src[t] || (PRESET_SET.has(t) ? "preset" : "model");

function bucketOf(t) {
  if (!t.date) return "unsched";
  if (t.period) return t.date < addDays(TODAY, 7) ? "soon" : "later";
  if (t.date < TODAY) return "over";
  if (t.date === TODAY) return "today";
  if (t.date === addDays(TODAY, 1)) return "tmr";
  if (t.date === addDays(TODAY, 2)) return "dat";
  return "later";
}
const BUCKETS = [["over", "已逾期"], ["today", "今天"], ["tmr", "明天"], ["dat", "后天"], ["soon", "期限快到"], ["later", "之后"], ["unsched", "待安排"]];
const sortTodos = (a, b) => (a.date || "9999").localeCompare(b.date || "9999") || (a.time || "").localeCompare(b.time || "");
function whenText(t) {
  if (!t.date) return "没有日期";
  if (t.period) return `期限：${t.date.slice(5)} 前`;
  return fmtDate(t.date) + (t.time ? " " + t.time : "");
}

function groupsOf(items) {
  const cnt = new Map();
  items.forEach((it) => new Set(it.tags).forEach((t) => cnt.set(t, (cnt.get(t) || 0) + 1)));
  const g = new Map();
  for (const [t, n] of cnt) {
    const [p, c] = t.split("/");
    if (!g.has(p)) g.set(p, { p, kids: [] });
    g.get(p).kids.push({ tag: t, label: c || "其他", n });
  }
  for (const grp of g.values()) {
    grp.n = items.filter((it) => it.tags.some((t) => t.split("/")[0] === grp.p)).length;
    grp.kids.sort((a, b) => b.n - a.n);
  }
  return [...g.values()].sort((a, b) => b.n - a.n);
}

function tagBar(items, sel, onChange, compact) {
  const groups = groupsOf(items);
  const el = document.createElement("div");
  el.className = "tagbar" + (compact ? " compact" : "");
  const html = [`<button class="chip all ${sel.size ? "" : "on"}" data-all="1">全部</button>`];
  for (const g of groups) {
    if (g.kids.length === 1 && g.kids[0].tag === g.p) {
      html.push(`<span class="grp"><button class="chip ${sel.has(g.p) ? "on" : ""}" data-t="${esc(g.p)}">${esc(g.p)} <i>${g.kids[0].n}</i></button></span>`);
      continue;
    }
    const on = g.kids.filter((k) => sel.has(k.tag)).length;
    const st = on === 0 ? "" : on === g.kids.length ? "on" : "part";
    html.push(`<span class="grp"><button class="pchip ${st}" data-p="${esc(g.p)}" title="选中或取消「${esc(g.p)}」下的全部标签">${esc(g.p)}</button>${g.kids.map((k) => `<button class="chip ${sel.has(k.tag) ? "on" : ""}" data-t="${esc(k.tag)}">${esc(k.label)} <i>${k.n}</i></button>`).join("")}</span>`);
  }
  el.innerHTML = html.join("");
  el.onclick = (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    const s = new Set(sel);
    if (b.dataset.all) s.clear();
    else if (b.dataset.p) {
      const g = groups.find((x) => x.p === b.dataset.p);
      const all = g.kids.every((k) => s.has(k.tag));
      g.kids.forEach((k) => (all ? s.delete(k.tag) : s.add(k.tag)));
    } else { const t = b.dataset.t; s.has(t) ? s.delete(t) : s.add(t); }
    onChange(s);
  };
  return el;
}

function selSummary(sel, count, unit, onChange, items = []) {
  const el = document.createElement("div");
  el.className = "selsum";
  if (!sel.size) { el.innerHTML = `全部 ${count} ${unit}`; return el; }
  const parts = [], rest = new Set(sel);
  for (const g of groupsOf(items)) {
    const tags = g.kids.map((k) => k.tag);
    if (tags.length > 1 && tags.every((t) => sel.has(t))) { parts.push([`${g.p}（全部）`, tags]); tags.forEach((t) => rest.delete(t)); }
  }
  rest.forEach((t) => parts.push([tagName(t), [t]]));
  el.innerHTML = `已选：${parts.map(([l, ts]) => `<span class="s">${esc(l)}<button data-t="${esc(ts.join("|"))}" title="去掉">×</button></span>`).join(" + ")} · 共 ${count} ${unit} · <a data-clear="1">清除</a>`;
  el.onclick = (e) => {
    const b = e.target.closest("[data-t],[data-clear]");
    if (!b) return;
    const s = new Set(sel);
    b.dataset.clear ? s.clear() : b.dataset.t.split("|").forEach((t) => s.delete(t));
    onChange(s);
  };
  return el;
}

function complete(t, rerender) {
  t.done = !t.done; save(); rerender();
  if (t.done) toast(`已完成「${t.title}」`, () => { t.done = false; save(); rerender(); });
}

function todoRow(t, sel, rerender, editable) {
  const el = document.createElement("div");
  el.className = "trow" + (t.done ? " done" : "");
  const red = bucketOf(t) === "over" && !t.done;
  el.innerHTML = `<button class="ck ${t.done ? "done" : ""}" title="完成"></button>
    <div class="body"><div class="t">${esc(t.title)}</div>
      <div class="tags">${t.tags.map((g) => `<span class="tg ${sel && sel.has(g) ? "hit" : ""}">${esc(g)}<button class="x" data-rm="${esc(g)}" title="去掉这个标签">×</button></span>`).join("")}${editable ? `<button class="addtag" title="改标签">＋ 标签</button>` : ""}${t.locked ? `<span class="lock" title="你改过这件事的标签，模型以后不会再改">· 已手动调整</span>` : ""}</div></div>
    <div class="when ${red ? "red" : ""}">${esc(whenText(t))}</div>`;
  el.querySelector(".ck").onclick = () => complete(t, rerender);
  if (!editable) return el;
  const tagsEl = el.querySelector(".tags");
  tagsEl.onmouseenter = () => tagsEl.classList.add("edit");
  tagsEl.onmouseleave = () => tagsEl.classList.remove("edit");
  tagsEl.querySelectorAll("[data-rm]").forEach((b) => (b.onclick = () => {
    t.tags = t.tags.filter((g) => g !== b.dataset.rm); t.locked = true; save(); rerender();
  }));
  el.querySelector(".addtag").onclick = (e) => {
    const inp = document.createElement("input");
    inp.className = "taginput"; inp.setAttribute("list", "alltags"); inp.placeholder = "输入或选择，如 生活/缴费";
    refreshDatalist();
    e.target.replaceWith(inp); inp.focus();
    const done = () => {
      const v = normTag(inp.value);
      if (v && !t.tags.includes(v)) {
        t.tags.push(v); t.locked = true;
        if (!allTags().includes(v) || !PRESET_SET.has(v)) S.src[v] = S.src[v] || "user";
      }
      save(); rerender();
    };
    inp.onkeydown = (ev) => { if (ev.key === "Enter") done(); if (ev.key === "Escape") rerender(); };
    inp.onblur = done;
  };
  return el;
}
const normTag = (v) => v.trim().replace(/\s*\/\s*/g, "/").split("/").filter(Boolean).slice(0, 2).join("/");
function refreshDatalist() {
  $("alltags").innerHTML = [...new Set([...allTags(), ...PRESET_SET])].map((t) => `<option value="${esc(t)}">`).join("");
}

function todoList(items, sel, rerender, editable) {
  const frag = document.createDocumentFragment();
  for (const [k, label] of BUCKETS) {
    const rows = items.filter((t) => bucketOf(t) === k).sort(sortTodos);
    if (!rows.length) continue;
    const h = document.createElement("div");
    h.className = "bucket" + (k === "over" ? " red" : "");
    h.innerHTML = `${label}<i>${rows.length}</i>`;
    frag.append(h);
    rows.forEach((t) => frag.append(todoRow(t, sel, rerender, editable)));
  }
  return frag;
}

/* ---------- 左侧标签树（与知识库同一风格，可勾选多选） ---------- */
const expanded = { todos: new Set(), kb: new Set() };
const treeOpen = { todos: false, kb: false };
function tagTree(ctx, items, sel, onChange, allLabel, hint) {
  const groups = groupsOf(items).sort((a, b) => a.p.localeCompare(b.p, "zh"));
  const untagged = items.filter((i) => !i.tags.length).length;
  const keyTags = {};
  const state = (tags) => { const n = tags.filter((t) => sel.has(t)).length; return n === 0 ? "" : n === tags.length ? "on" : "part"; };
  const row = (key, tags, label, n, { pad = 10, caret = "", cls = "" } = {}) => {
    keyTags[key] = tags;
    const st = key === "all" ? (sel.size ? "" : "on") : state(tags);
    const cb = key === "all" ? `<span class="cb-sp"></span>` : `<span class="cb ${st}" data-cb="1" title="勾选可同时看多类"></span>`;
    return `<div class="tree-item ${st === "on" ? "active" : ""} ${cls}" data-k="${esc(key)}" style="padding-left:${pad}px">${caret || `<span class="caret"></span>`}${cb}<span class="nm">${label}</span><span class="n">${n}</span></div>`;
  };
  let html = row("all", [], allLabel, items.length);
  for (const g of groups) {
    const tags = g.kids.map((k) => k.tag);
    if (g.kids.length === 1 && g.kids[0].tag === g.p) { html += row("t:" + g.p, tags, `🏷️ ${esc(g.p)}`, g.n); continue; }
    const open = expanded[ctx].has(g.p);
    html += row("g:" + g.p, tags, `🏷️ ${esc(g.p)}`, g.n, { caret: `<span class="caret" data-tg="${esc(g.p)}">${open ? "▼" : "▶"}</span>` });
    if (open) [...g.kids].sort((a, b) => b.n - a.n).forEach((k) => { html += row("t:" + k.tag, [k.tag], esc(k.label), k.n, { pad: 30 }); });
  }
  html += row("none", [NONE], "未打标签", untagged, { cls: "untagged" });
  const wrap = document.createElement("div");
  wrap.className = "treewrap" + (treeOpen[ctx] ? " open" : "");
  const selText = sel.size ? [...sel].map(tagName).join(" + ") : "全部";
  wrap.innerHTML = `<button class="treebtn">🏷️ 标签：${esc(selText)} ${treeOpen[ctx] ? "▲" : "▼"}</button><div class="tree">${html}</div><div class="treehint">${hint}<br>点标签名只看这一类；勾选方框可以同时看多类。</div>`;
  wrap.querySelector(".treebtn").onclick = () => { treeOpen[ctx] = !treeOpen[ctx]; onChange(sel); };
  wrap.querySelector(".tree").onclick = (e) => {
    const it = e.target.closest(".tree-item");
    if (!it) return;
    const caret = e.target.closest("[data-tg]");
    if (caret) { const p = caret.dataset.tg; expanded[ctx].has(p) ? expanded[ctx].delete(p) : expanded[ctx].add(p); return onChange(sel); }
    const k = it.dataset.k, tags = keyTags[k];
    if (k === "all") return onChange(new Set());
    if (k.startsWith("g:")) expanded[ctx].add(k.slice(2));
    if (k.startsWith("t:") && k.includes("/")) expanded[ctx].add(k.slice(2).split("/")[0]);
    if (e.target.closest("[data-cb]")) {
      const s = new Set(sel), all = tags.every((t) => s.has(t));
      tags.forEach((t) => (all ? s.delete(t) : s.add(t)));
      return onChange(s);
    }
    onChange(new Set(tags));
  };
  return wrap;
}

  const sel = new Set(S.selTodo);
  const list = open.filter((t) => match(t, sel));

      <li>左侧标签树和知识库一样：<b>点标签名</b>只看这一类（点“生活”看整个生活类）；<b>勾选前面的方框</b>可以同时看多类，比如勾“缴费”和“会议”。点“全部待办”恢复。</li>
      <li>这里只列<b>待办用到的</b>标签，件数只算未完成的待办（不会出现“照片”这类只在文件上用的标签）。选择会被记住，刷新后仍在。</li>
      <li>鼠标移到某条待办上可以点 × 去掉标签，或点“＋ 标签”添加；手动改过的待办会锁定，以后模型不会再改。</li></ul></div>
    <div class="layout"><div id="side"></div><div>
    <div class="ask"><b>跟助手说：</b><input id="ask" placeholder="比如：看看缴费和会议相关的待办"></div>
    <div class="box"><div class="stline"><span class="on">未完成（${open.length}）</span><span>待安排</span><span>已完成</span><span>已删除</span><span>全部</span></div>
      <div class="filterwrap" id="fw"></div><div id="list"></div></div></div></div>`;
  const onChange = (s) => { S.selTodo = [...s]; save(); viewTodos(); };
  $("side").append(tagTree("todos", open, sel, onChange, "📋 全部待办", "标签由模型按内容自动打，可以随时修改；一件待办可以有多个标签。"));
  $("fw").append(selSummary(sel, list.length, "件", onChange, open));

  $("ask").onkeydown = (e) => { if (e.key === "Enter" && e.target.value.trim()) { const v = e.target.value.trim(); go("chat"); send(v); } };
}

/* ---------- 助手页 ---------- */
const KW = [
  [/缴费|交费|账单|水电|电费|水费|燃气|话费|物业|宽带/, "生活/缴费"],
  [/会议|开会|周会|评审会/, "工作/会议"],
  [/报告|周报/, "工作/报告"],
  [/出差/, "工作/出差"],
  [/健康|看病|体检|医|牙|健身/, "生活/健康医疗"],
  [/保险|车险/, "生活/保险"],
  [/人情|礼物|随礼|婚礼|生日/, "家庭/人情往来"],
  [/理财|基金/, "财务/理财"],
];
function parseTags(text) {
  const used = usedTags(openTodos());
  const tags = new Set();
  KW.forEach(([re, t]) => { if (re.test(text) && used.includes(t)) tags.add(t); });
  used.forEach((t) => { const c = t.split("/")[1]; if (c && c.length > 1 && text.includes(c)) tags.add(t); if (!c && text.includes(t)) tags.add(t); });
  const parents = [...new Set(used.map((t) => t.split("/")[0]))];
  for (const p of parents) {
    if (text.includes(p) && ![...tags].some((t) => t.startsWith(p + "/"))) used.filter((t) => t.split("/")[0] === p).forEach((t) => tags.add(t));
  }
  return tags;
}

function initChat() {
  if (S.chat) return;
  const open = openTodos();
  const over = open.filter((t) => bucketOf(t) === "over").length;
  const today = open.filter((t) => bucketOf(t) === "today").length;
  S.chat = [{ who: "bot", text: `下午好！今天还有 ${today} 件事没完成，另外有 ${over} 件已经逾期。想按类别看，直接跟我说就行，比如“看看缴费和会议相关的待办”。` }];
  save();
}

function send(text) {
  initChat();
  S.chat.push({ who: "me", text });
  save(); renderStream(true);
  setTimeout(() => { S.chat.push(reply(text)); save(); renderStream(); }, 500);
}

function reply(text) {
  const parsed = parseTags(text);
  const prev = new Set(S.lastTags);
  let tags;
  if (/去掉|不要|除了|不看/.test(text) && prev.size) { tags = new Set([...prev].filter((t) => !parsed.has(t))); }
  else if (/再加|加上|还有|也看/.test(text) && prev.size) { tags = new Set([...prev, ...parsed]); }
  else tags = parsed;
  const wantAll = /全部|所有|全都/.test(text) && !parsed.size;
  if (!tags.size && !wantAll) {
    const used = usedTags(openTodos());
    return { who: "bot", text: `没听出是哪类事。你的待办现在用到这些标签：${used.join("、")}。可以说“看看缴费的”，也可以一次说几类，比如“缴费和会议”。` };
  }
  if (wantAll) tags = new Set();
  S.lastTags = [...tags];
  const ids = openTodos().filter((t) => match(t, tags)).map((t) => t.id);
  const msg = { who: "bot", card: { tags: [...tags], ids } };
  msg.text = tags.size ? `按${[...tags].map((t) => `「${t}」`).join("")}找到 ${ids.length} 件未完成的待办：` : `全部未完成的待办共 ${ids.length} 件：`;
  if (!S.tipShown && tags.size) { msg.tip = "可以接着说“再加上报告”或“去掉会议”，也可以直接在这里打勾完成。"; S.tipShown = true; }
  return msg;
}

function renderStream(typing) {
  const st = $("stream");
  if (!st) return;
  st.innerHTML = "";
  for (const m of S.chat) {
    const el = document.createElement("div");
    el.className = "msg" + (m.who === "me" ? " me" : "");
    el.innerHTML = `${m.who === "me" ? `<div class="avatar">我</div>` : `<div class="avatar">禾</div>`}<div class="bubble"><p>${esc(m.text)}</p></div>`;
    const b = el.querySelector(".bubble");
    if (m.card) {
      const sel = new Set(m.card.tags);
      const items = m.card.ids.map((id) => S.todos.find((t) => t.id === id)).filter(Boolean);
      const card = document.createElement("div");
      card.className = "rcard";
      card.innerHTML = `<div class="rh">${sel.size ? "标签：" + [...sel].map((t) => `<span class="tg hit">${esc(t)}</span>`).join(" + ") : "全部标签"}</div>`;
      card.append(todoList(items, sel, () => renderStream(), false));
      const f = document.createElement("div");
      f.className = "rf";
      f.innerHTML = `<a>在待办页按这些标签查看 ›</a>`;
      f.querySelector("a").onclick = () => { S.selTodo = [...sel]; save(); go("todos"); };
      card.append(f);
      b.append(card);
    }
    if (m.tip) { const tp = document.createElement("div"); tp.className = "tip"; tp.textContent = "💡 " + m.tip; b.append(tp); }
    st.append(el);
  }
  if (typing) { const el = document.createElement("div"); el.className = "msg"; el.innerHTML = `<div class="avatar">禾</div><div class="bubble typing">正在输入…</div>`; st.append(el); }
  st.scrollTop = st.scrollHeight;
}

function viewChat() {

      <li>“最近安排”面板顶部加了一行小标签，只列面板里出现的标签（不到 2 个就不显示），可多选，选择会被记住。</li></ul></div>

      <div class="dock"><div class="sheet" id="sheet"></div>
        <div class="dockrow"><button class="recent" id="recent">📅 最近安排 ${todayLeft}${over ? `<span class="over">${over}</span>` : ""}</button>

function renderSheet() {
  const sheet = $("sheet");
  const items = openTodos().filter((t) => ["over", "today", "tmr", "dat", "soon"].includes(bucketOf(t)));
  const sel = new Set(S.selPanel.filter((t) => usedTags(items).includes(t)));
  const shown = items.filter((t) => match(t, sel));
  sheet.innerHTML = `<div class="sheet-head"><b>最近安排</b><span class="spacer"></span><button class="x" title="关闭">×</button></div>`;
  sheet.querySelector(".x").onclick = () => { sheet.classList.remove("show"); $("recent").classList.remove("on"); };
  if (usedTags(items).length >= 2) sheet.append(tagBar(items, sel, (s) => { S.selPanel = [...s]; save(); renderSheet(); }, true));
  sheet.append(todoList(shown, sel, () => { renderSheet(); }, false));
  const unsched = openTodos().filter((t) => !t.date).length;
  const f = document.createElement("div");
  f.className = "sheet-foot";
  f.innerHTML = `<a>去待办页 ›</a><span>待安排 ${unsched} 件</span><span class="spacer"></span><a>邮件提醒设置</a>`;
  f.querySelector("a").onclick = () => go("todos");
  sheet.append(f);
}

/* ---------- 知识库 ---------- */
function viewKB() {
  const sel = new Set(S.selKB);
  const list = S.files.filter((f) => match(f, sel));
  const todoOnly = usedTags(S.todos).filter((t) => !usedTags(S.files).includes(t));
  const relTodos = sel.size ? openTodos().filter((t) => match(t, sel)) : [];
  view.innerHTML = `<div class="note"><b>看点：</b><ul>
      <li>和待办页是<b>同一套标签、同一种标签树</b>，用法一样（点名字只看这一类，勾方框同时看多类）；这里只列文件用到的标签，件数只算文件。</li>
      <li>只在待办上用到的 ${todoOnly.map((t) => `「${esc(t)}」`).join("") || "（无）"} 不会出现在这里。</li>
      <li>选了某个标签，如果待办里也有这个标签，会提示一句并可以跳过去——同一个标签把相关的事和文件串起来。</li></ul></div>
    <div class="layout"><div id="side"></div><div>
    <div class="ask"><b>跟助手说：</b><input placeholder="用一句话描述你要找的内容（按意思找，不用记文件名）"></div>
    <div class="box"><div class="filterwrap" id="fw"></div><div id="banner"></div><div id="list"></div></div></div></div>`;
  const onChange = (s) => { S.selKB = [...s]; save(); viewKB(); };
  $("side").append(tagTree("kb", S.files, sel, onChange, "📚 全部文件", "标签由文件管理模型自动生成，可以随时修改；一个文件可以有多个标签。"));
  $("fw").append(selSummary(sel, list.length, "个文件", onChange, S.files));
  if (relTodos.length) {
    $("banner").innerHTML = `<div class="banner">这些标签下还有 ${relTodos.length} 件未完成的待办 · <a id="totodo">去待办页看 ›</a></div>`;
    $("totodo").onclick = () => { S.selTodo = [...sel]; save(); go("todos"); };
  }
  $("list").innerHTML = list.map((f) => `<div class="frow"><div class="fico">${esc(f.name.split(".").pop())}</div><div class="body" style="flex:1;min-width:0"><div>${esc(f.name)}</div><div class="tags">${f.tags.map((g) => `<span class="tg ${sel.has(g) ? "hit" : ""}">${esc(g)}</span>`).join("")}</div></div></div>`).join("") || `<div class="empty">这些标签下没有文件</div>`;
}

/* ---------- 管理标签 ---------- */
let editing = null;
function viewManage() {
  const tags = allTags().sort((a, b) => a.localeCompare(b, "zh"));
  const cnt = (items, t) => items.filter((i) => i.tags.includes(t)).length;
  const srcLabel = { user: "我建的", model: "模型新建", preset: "预设" };
  view.innerHTML = `<div class="note"><b>看点：</b><ul>
      <li>文件和待办<b>只有一套标签、一个管理入口</b>（知识库和待办页右上角的“管理标签”都打开这里）。</li>
      <li>每个标签分别写出用在几个文件、几件待办上；改名、合并、删除会同时作用到两边，操作前写清影响范围。删除标签不会删文件或待办。</li>
      <li>预设标签库默认不显示，第一次用到才出现；本次给待办补了 3 个二级标签（标“新”）。</li></ul></div>
    <div class="box"><div class="mhead"><b>管理标签</b><span class="spacer"></span><input id="newtag" placeholder="新建标签，如 生活/缴费"><button class="btn" id="addtag">新建</button></div>
      <table class="mt"><thead><tr><th>标签</th><th>文件</th><th>待办</th><th class="hide-m">来源</th><th>操作</th></tr></thead><tbody>
      ${tags.map((t) => {
        const nf = cnt(S.files, t), nt = cnt(S.todos, t);
        const n = (v) => (v ? v : `<span class="z">0</span>`);
        let ops = `<button data-op="ren" data-t="${esc(t)}">改名</button><button data-op="mer" data-t="${esc(t)}">合并到…</button><button class="del" data-op="del" data-t="${esc(t)}">删除</button>`;
        let name = esc(t);
        if (editing && editing.t === t && editing.op === "ren") {
          name = `<input id="ed" value="${esc(t)}" style="width:150px">`;
          ops = `<button data-op="ok">确定</button><button data-op="cancel">取消</button><span class="lock">${nf} 个文件、${nt} 件待办会一起更新</span>`;
        }
        if (editing && editing.t === t && editing.op === "mer") {
          ops = `<select id="ed">${tags.filter((x) => x !== t).map((x) => `<option>${esc(x)}</option>`).join("")}</select> <button data-op="ok">合并</button><button data-op="cancel">取消</button><div class="lock">${nf} 个文件、${nt} 件待办改用目标标签，「${esc(t)}」随后消失</div>`;
        }
        if (editing && editing.t === t && editing.op === "del") {
          ops = `<button class="del" data-op="ok">确认删除</button><button data-op="cancel">取消</button><div class="lock">从 ${nf} 个文件、${nt} 件待办上去掉这个标签，文件和待办本身不删</div>`;
        }
        return `<tr><td>${name}</td><td class="n">${n(nf)}</td><td class="n">${n(nt)}</td><td class="hide-m"><span class="src ${tagSrc(t)}">${srcLabel[tagSrc(t)]}</span></td><td class="ops">${ops}</td></tr>`;
      }).join("")}
      </tbody></table></div>
    <details class="box preset"><summary>预设标签库（两层，候选用，未用到的不会显示在页面上）</summary><div class="ptree">
      ${PRESET.map(([p, cs]) => `<div><b>${p}</b>${cs.map((c) => { const t = `${p}/${c}`; return `<span class="${tags.includes(t) ? "used" : ""} ${NEW_PRESET.has(t) ? "new" : ""}">${c}</span>`; }).join("")}</div>`).join("")}
      <div class="lock" style="margin-top:6px">加粗 = 已经在用；用户可以新建自己的标签（如上表的「合同」），模型打标签时会参照用户自己建的标签和手动修改的风格。</div></div></details>`;
  view.querySelectorAll("[data-op]").forEach((b) => (b.onclick = () => {
    const op = b.dataset.op;
    if (op === "cancel") { editing = null; return viewManage(); }
    if (op === "ok") return applyEdit();
    editing = { op, t: b.dataset.t };
    viewManage();
    const ed = $("ed"); if (ed) { ed.focus(); if (ed.select) ed.select(); ed.onkeydown = (e) => { if (e.key === "Enter") applyEdit(); if (e.key === "Escape") { editing = null; viewManage(); } }; }
  }));
  $("addtag").onclick = () => {
    const v = normTag($("newtag").value);
    if (!v) return;
    if (allTags().includes(v)) return toast(`「${v}」已经有了`);
    S.custom.push(v); S.src[v] = "user"; save(); viewManage(); toast(`已新建「${v}」，给文件或待办加标签时可以选到它`);
  };
}

function replaceTag(from, to) {
  const fix = (arr) => [...new Set(arr.map((t) => (t === from ? to : t)).filter(Boolean))];
  let nf = 0, nt = 0;
  S.files.forEach((f) => { if (f.tags.includes(from)) { nf++; f.tags = fix(f.tags); } });
  S.todos.forEach((t) => { if (t.tags.includes(from)) { nt++; t.tags = fix(t.tags); } });
  ["selTodo", "selKB", "selPanel", "lastTags"].forEach((k) => (S[k] = fix(S[k])));
  S.custom = fix(S.custom);
  return [nf, nt];
}

function applyEdit() {
  const { op, t } = editing;
  const ed = $("ed");
  if (op === "ren") {
    const v = normTag(ed.value);
    if (!v || v === t) { editing = null; return viewManage(); }
    if (allTags().includes(v)) return toast(`「${v}」已经存在，请用“合并到…”`);
    const [nf, nt] = replaceTag(t, v);
    S.src[v] = "user";
    toast(`已改名为「${v}」：${nf} 个文件、${nt} 件待办一起更新`);
  } else if (op === "mer") {
    const [nf, nt] = replaceTag(t, ed.value);
    toast(`已合并到「${ed.value}」：${nf} 个文件、${nt} 件待办`);
  } else {
    const [nf, nt] = replaceTag(t, "");
    toast(`已删除「${t}」：从 ${nf} 个文件、${nt} 件待办上去掉`);
  }
  editing = null; save(); viewManage();
}

/* ---------- 切换 ---------- */
const VIEWS = { todos: viewTodos, chat: viewChat, kb: viewKB, manage: viewManage };
function go(v) {
  cur = VIEWS[v] ? v : "todos";
  history.replaceState(null, "", "#" + cur);
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.v === cur));
  editing = null;
  VIEWS[cur]();
  window.scrollTo(0, 0);
}
$("tabs").onclick = (e) => { const b = e.target.closest("button"); if (b) go(b.dataset.v); };
$("reset").onclick = () => { localStorage.removeItem(KEY); S = seed(); go(cur); toast("演示数据已重置"); };
go(cur);
</script>
</body>
</html>

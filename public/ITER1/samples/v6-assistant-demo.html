<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>助手页临时演示（v6 方向）· 个人日常助手</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--border:#e3e6eb;--text:#1f2329;--muted:#6b7280;--primary:#2f6fed;--pw:#eaf1ff;--ok:#1a9b5a;--okw:#e7f6ee;--warn:#c27a00;--warnw:#fff4dc;--spark:#8a4dff;--sparkw:#f3ecff;--r:10px;font-size:14px}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg);line-height:1.6}
button{font:inherit;cursor:pointer}
.app{display:flex;flex-direction:column;height:100vh}
/* 演示条 */
.demobar{background:#111827;color:#e5e7eb;padding:8px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.demobar .tag{background:#f59e0b;color:#111;font-weight:600;border-radius:4px;padding:1px 6px;font-size:12px}
.demobar select{background:#1f2937;color:#fff;border:1px solid #374151;border-radius:6px;padding:4px 8px}
.timeline{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.tl{background:#1f2937;border:1px solid #374151;color:#d1d5db;border-radius:999px;padding:4px 12px;font-size:13px}
.tl.done{border-color:#10b981;color:#a7f3d0}.tl.cur{background:#2f6fed;border-color:#2f6fed;color:#fff}
.tl:hover{border-color:#9ca3af}
.demobar .ghost{background:none;border:1px solid #4b5563;color:#d1d5db;border-radius:6px;padding:4px 10px}
.body{flex:1;display:flex;min-height:0}
/* 菜单 */
.side{width:72px;background:#1d2433;display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:4px}
.side a{width:60px;padding:8px 0;border-radius:8px;color:#cfd6e4;text-align:center;font-size:11px;text-decoration:none}
.side a .i{display:block;font-size:20px}.side a.on{background:#2f6fed;color:#fff}
/* 主区 */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.made{background:var(--panel);border-bottom:1px solid var(--border);padding:10px 18px}
.made h3{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between}
.made h3 b{color:var(--ok);font-size:14px}
.madelist{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.mc{flex:0 0 auto;border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px;background:#fafbfc;cursor:pointer;animation:pop .4s}
.mc small{color:var(--muted);margin-left:6px}.mc:hover{border-color:var(--primary)}
.madeempty{color:var(--muted);font-size:13px}
.stream{flex:1;overflow-y:auto;padding:18px}
.inner{max-width:780px;margin:0 auto}
.divider{text-align:center;color:var(--muted);font-size:12px;margin:18px 0 10px}
.divider span{background:var(--bg);padding:0 10px;position:relative}
.divider:before{content:"";display:block;border-top:1px dashed #cfd4dc;position:relative;top:11px}
.msg{display:flex;gap:10px;margin:10px 0;animation:pop .35s}
.msg .av{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;flex-shrink:0}
.msg.me{flex-direction:row-reverse}.msg.me .av{background:#9ca3af}
.bub{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;max-width:100%;min-width:0}
.msg.me .bub{background:var(--pw);border-color:#c9dbff}
.bub p{margin:0 0 6px}.bub p:last-child{margin-bottom:0}
.card{flex:1}
.ctitle{font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge{font-size:11px;border-radius:4px;padding:0 6px;font-weight:500}
.b-spark{background:var(--sparkw);color:var(--spark)}.b-ok{background:var(--okw);color:var(--ok)}.b-pri{background:var(--pw);color:var(--primary)}.b-warn{background:var(--warnw);color:var(--warn)}
.why{margin-top:8px;font-size:12px;color:#7c5a00;background:#fff8e6;border-radius:6px;padding:4px 8px}
.why:before{content:"🎯 因为你是 · "}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--border);background:#fff;border-radius:7px;padding:4px 12px}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.pri{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.pri:hover{color:#fff;opacity:.9}
.muted{color:var(--muted);font-size:12px}
ul.plain{margin:4px 0;padding-left:18px}
.spark{border-left:4px solid var(--spark);background:linear-gradient(90deg,#faf7ff,#fff)}
.quote{background:#f7f7fb;border-radius:6px;padding:6px 10px;margin:6px 0;font-size:15px}
.ai{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--border);padding:5px 0}
.ai:last-child{border:0}.ai .who{color:var(--muted);font-size:12px;white-space:nowrap}
/* 搜索 */
.tabs{display:flex;gap:4px;margin:6px 0}
.tabs button{border:1px solid var(--border);background:#fff;border-radius:999px;padding:1px 10px;font-size:12px}
.tabs button.on{background:var(--text);color:#fff;border-color:var(--text)}
.res{display:flex;gap:10px;padding:8px 0;border-top:1px solid #f0f1f3}
.thumb{width:112px;height:66px;border-radius:6px;flex-shrink:0;position:relative;display:grid;place-items:center;font-size:24px;color:#fff;overflow:hidden}
.t-video{background:linear-gradient(135deg,#334155,#64748b)}.t-audio{background:linear-gradient(135deg,#0f766e,#14b8a6)}.t-image{background:linear-gradient(135deg,#a16207,#facc15)}.t-doc{background:linear-gradient(135deg,#1e40af,#60a5fa)}
.thumb .bar{position:absolute;left:6px;right:6px;bottom:6px;height:4px;background:rgba(255,255,255,.35);border-radius:2px}
.thumb .bar i{position:absolute;top:-3px;width:10px;height:10px;border-radius:50%;background:#f43f5e;border:2px solid #fff}
.thumb .wave{position:absolute;bottom:8px;left:8px;right:8px;display:flex;gap:2px;align-items:flex-end;height:20px}
.thumb .wave i{flex:1;background:rgba(255,255,255,.7);border-radius:1px}
.res .rt{font-weight:500}.res .rs{font-size:13px;margin:2px 0}
mark{background:#fde68a;padding:0 2px;border-radius:2px}
.kind{font-size:11px;color:var(--muted)}
/* 周报 */
.doc{border:1px solid var(--border);border-radius:8px;padding:10px 14px;background:#fcfcfd;margin-top:6px}
.doc h4{margin:8px 0 4px;font-size:13px;color:var(--muted)}
.line{margin:3px 0}
.src{display:inline-block;font-size:11px;border:1px solid #d7dcf5;color:#4256c4;background:#f3f5ff;border-radius:999px;padding:0 7px;margin-left:4px;cursor:pointer;vertical-align:1px}
.src:hover{background:#e3e8ff}
.srcq{font-size:12px;background:#f3f5ff;border-left:3px solid #8b9cf0;padding:4px 8px;margin:4px 0 6px;color:#374151;border-radius:0 4px 4px 0}
/* 建站 */
.steps{display:flex;gap:0;margin:8px 0 12px}
.st{flex:1;text-align:center;font-size:12px;color:var(--muted);position:relative}
.st .dot{width:22px;height:22px;border-radius:50%;margin:0 auto 2px;background:#e5e7eb;display:grid;place-items:center;font-size:11px;color:#6b7280;position:relative;z-index:1}
.st:not(:first-child):before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:#e5e7eb}
.st.done .dot{background:var(--ok);color:#fff}.st.done:before,.st.cur:before{background:var(--ok)!important}
.st.cur .dot{background:var(--primary);color:#fff;box-shadow:0 0 0 4px var(--pw)}.st.cur{color:var(--text);font-weight:600}
.opt{display:block;padding:5px 8px;border:1px solid var(--border);border-radius:6px;margin:4px 0;cursor:pointer}
.opt:hover{border-color:var(--primary)}
.tables{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}
.tbl{border:1px solid #cbd5e1;border-radius:6px;min-width:150px;font-size:12px;background:#fff}
.tbl b{display:block;background:#334155;color:#fff;padding:3px 8px;border-radius:5px 5px 0 0}
.tbl div{padding:1px 8px;border-top:1px solid #f1f5f9;font-family:ui-monospace,Menlo,monospace}
.tbl .fk{color:#2f6fed}.tbl .pk{color:#b45309}
pre.sql{background:#0f172a;color:#e2e8f0;border-radius:6px;padding:8px 10px;font-size:12px;overflow:auto;max-height:220px}
.browser{border:1px solid #cbd5e1;border-radius:8px;overflow:hidden;margin:6px 0;background:#fff}
.browser .top{background:#e5e7eb;padding:4px 8px;font-size:11px;color:#6b7280}
.browser .top span{background:#fff;border-radius:4px;padding:0 8px;margin-left:24px}
.site{padding:12px}.site h2{margin:0 0 4px;font-size:18px}
.site .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.site .it{border:1px solid #eee;border-radius:6px;padding:6px;font-size:12px}
.site .it .ph{height:44px;border-radius:4px;margin-bottom:4px}
.progress{height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;background:var(--ok);width:0;transition:width 1.6s}
/* 输入 */
.composer{border-top:1px solid var(--border);background:var(--panel);padding:10px 18px}
.chips{max-width:780px;margin:0 auto 6px;display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:#fafbfc;border-radius:999px;padding:2px 10px;font-size:12px;color:#374151}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.inrow{max-width:780px;margin:0 auto;display:flex;gap:8px}
.inrow input{flex:1;border:1px solid var(--border);border-radius:8px;padding:8px 12px;font:inherit}
.inrow .tool{border:1px solid var(--border);background:#fff;border-radius:8px;width:38px}
/* 右栏 */
.right{width:280px;border-left:1px solid var(--border);background:var(--panel);overflow-y:auto;padding:14px}
.right h3{font-size:14px;margin:0 0 8px}
.prof{display:grid;grid-template-columns:62px 1fr;gap:4px 8px;font-size:13px}
.prof dt{color:var(--muted)}.prof dd{margin:0}
.box{border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:12px}
.saved{font-size:26px;font-weight:700;color:var(--ok)}
.typing{display:inline-flex;gap:3px}.typing i{width:6px;height:6px;border-radius:50%;background:#9ca3af;animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111827;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;z-index:9;animation:pop .3s}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:.3}}
@media(max-width:1000px){.right{display:none}}
@media(max-width:640px){.side{display:none}.stream{padding:10px}.thumb{width:80px}.site .grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="demobar">
    <span class="tag">演示</span>

    <aside class="right">

      <div class="box">

        <div class="saved" id="saved">0 分钟</div>
        <div class="muted" id="savedDetail">还没开始，点上面的时间点看看</div>
      </div>
      <div class="box">
        <h3>👀 怎么看这个演示</h3>
        <ol class="muted" style="padding-left:18px;margin:0">
          <li>按顺序点上面的 5 个时间点（或“自动播放”），看助手在一周里会主动替你做什么。</li>

          <li>在下面输入框里随便问，或点建议说法。</li>
        </ol>
      </div>
    </aside>
  </div>
</div>

  const b = await bot(`<div class="ctitle">💡 你 ${s.days} 天前记的一个想法 <span class="badge b-spark">灵光一现</span></div>
    <div class="quote">“${esc(s.title)}”</div>
    <p>${esc(s.reason)}</p><p>要不要这周把它做出来？我会一步步带你，<b>不用会写代码</b>。</p>
    ${why(s.why)}
    <div class="btns"><button class="btn pri" data-a="go">现在就开始</button><button class="btn" data-a="later">排到周日晚上</button><button class="btn" data-a="drop">先放着</button></div>`, "card spark");
  b.querySelector('[data-a="go"]').onclick = () => play("sun");
  b.querySelector('[data-a="later"]').onclick = (e) => { e.target.parentNode.innerHTML = `<span class="badge b-ok">已排到 周日 11/2 20:00</span> <span class="muted">到时候我来叫你</span>`; };
  b.querySelector('[data-a="drop"]').onclick = (e) => { e.target.parentNode.innerHTML = `<span class="muted">好，继续留在“想做的事”里，月初回顾时再翻出来。</span>`; };
}

// ---------- ② 周三：会议录音自动整理 ----------
async function sceneWed() {
  const m = p.meeting;
  const b = await bot(`<div class="ctitle">🎙️ 刚才的录音我整理好了 <span class="badge b-ok">已完成</span></div>
    <p><b>${esc(m.title)}</b> <span class="muted">· ${m.len} · ${esc(m.people)}</span></p>
    <p>要点：${esc(m.summary)}</p>
    <p class="muted" style="margin-top:8px">行动项（日期从录音里听出来的）：</p>
    <div>${m.items.map(([t, who, d]) => `<div class="ai"><span>${who === "你" ? "☑️" : "⬜"} ${esc(t)}</span><span class="who">${esc(who)} · ${d}</span></div>`).join("")}</div>
    ${why(m.why)}
    <div class="btns"><button class="btn pri" data-a="add">把我的 ${m.items.filter((x) => x[1] === "你").length} 条加进待办</button><button class="btn" data-a="full">看完整纪要</button></div>`, "card");
  b.querySelector('[data-a="add"]').onclick = (e) => { e.target.parentNode.innerHTML = `<span class="badge b-ok">已加入待办</span> <span class="muted">到期前一天我会提醒你 · <a href="#" onclick="return false">撤销</a></span>`; };
  b.querySelector('[data-a="full"]').onclick = () => toast("完整纪要：按发言人分段，可以跳到原录音（演示）");
  addMade("🎙️", "会议纪要 + 行动项", 25, "wed");
  await sleep(300);
  const b2 = await bot(`<p>🔗 顺便说一句：${esc(m.link)}</p><div class="btns"><button class="btn">好</button><button class="btn">不用</button></div>`);
  b2.querySelectorAll(".btn").forEach((x) => x.onclick = () => { x.parentNode.innerHTML = `<span class="muted">${x.textContent === "好" ? "办好了 ✓" : "好的，不动它。"}</span>`; });
}

// ---------- ③ 按意思找：文字 / 录音 / 视频 / 图片 ----------
const ICON = { video: "🎬", audio: "🎙️", image: "🖼️", doc: "📄" }, KN = { video: "视频", audio: "录音", image: "图片", doc: "文档" };
function thumb(kind, pos) {
  if (kind === "video") return `<div class="thumb t-video">▶<div class="bar"><i style="left:${pos * 100}%"></i></div></div>`;
  if (kind === "audio") return `<div class="thumb t-audio">🎙️<div class="wave">${Array.from({ length: 22 }, (_, i) => `<i style="height:${20 + Math.abs(Math.sin(i * 1.7)) * 80}%;${Math.abs(i / 22 - pos) < .06 ? "background:#f43f5e" : ""}"></i>`).join("")}</div></div>`;
  return `<div class="thumb t-${kind}">${ICON[kind]}</div>`;
}
async function sceneSearch(q) {
  const s = p.search; q = q || s.q;
  me(q);
  const b = await bot(`<div class="ctitle">🔍 在你的资料里找到 ${s.res.length} 处 <span class="muted" style="font-weight:400">· 按意思找，录音和视频都已转成文字，图片里的字也认出来了</span></div>
    <div class="tabs"><button class="on" data-k="all">全部 ${s.res.length}</button>${["video", "audio", "image", "doc"].map((k) => `<button data-k="${k}">${ICON[k]} ${KN[k]}</button>`).join("")}</div>
    <div class="list">${s.res.map(([k, name, at, snip, act, pos]) => `<div class="res" data-k="${k}">${thumb(k, pos || 0)}<div style="min-width:0"><div class="rt">${esc(name)} <span class="kind">${KN[k]} · ${esc(at)}</span></div><div class="rs">${snip}</div><button class="btn" style="padding:1px 10px;font-size:12px" data-act="${esc(act)}">${esc(act)}</button></div></div>`).join("")}</div>
    ${why(s.why)}
    <div class="btns"><button class="btn" data-a="sum">把这几处合成一段话</button></div>`, "card");
  b.querySelectorAll(".tabs button").forEach((t) => t.onclick = () => { b.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x === t)); b.querySelectorAll(".res").forEach((r) => r.style.display = t.dataset.k === "all" || r.dataset.k === t.dataset.k ? "" : "none"); });
  b.querySelectorAll("[data-act]").forEach((x) => x.onclick = () => toast(x.dataset.act + "（演示）"));
  b.querySelector('[data-a="sum"]').onclick = (e) => { e.target.parentNode.innerHTML = `<div class="srcq" style="font-size:13px">综合 ${s.res.length} 处：${s.res.map((r) => r[3].replace(/<[^>]+>/g, "").replace(/^[^：]+：/, "")).slice(0, 2).join("；")}</div>`; };
  if (!made.find((m) => m.scene === "search")) addMade("🔍", `找到 ${s.res.length} 处资料`, 15, "search");
}

// ---------- ④ 周五：主动写好周报，每句可溯源 ----------
async function sceneFri() {
  const r = p.report;
  await bot(`<p>周五下午了，这周的${pk === "office" ? "周报" : "小结"}我先写好了初稿，你看看哪里要改。</p>`);
  const b = await bot(`<div class="ctitle">📝 ${esc(r.title)} <span class="badge b-pri">初稿</span></div>
    <div class="muted">${esc(r.ref)}。点每句后面的蓝色小标签，可以看到这句话从哪来。</div>
    <div class="doc">${r.sections.map(([h, lines]) => `<h4>${esc(h)}</h4>${lines.map(([t, src, q], i) => `<div class="line">• ${esc(t)}<span class="src" data-q="${esc(q)}">${esc(src)}</span></div>`).join("")}`).join("")}</div>
    ${why(r.why)}
    <div class="btns"><button class="btn pri" data-a="copy">复制全文</button><button class="btn" data-a="tone">换个语气</button><button class="btn" data-a="doc">导出 Word</button><button class="btn" data-a="edit">我口述修改</button></div>`, "card");
  b.querySelectorAll(".src").forEach((s) => s.onclick = () => { const n = s.parentNode.nextElementSibling; if (n && n.classList.contains("srcq")) { n.remove(); return; } const q = document.createElement("div"); q.className = "srcq"; q.textContent = "出处：" + s.dataset.q; s.parentNode.after(q); });
  b.querySelector('[data-a="copy"]').onclick = () => toast("已复制（演示）");
  b.querySelector('[data-a="tone"]').onclick = () => toast("可选：更正式 / 更简洁 / 更口语（演示）");
  b.querySelector('[data-a="doc"]').onclick = () => toast("已导出 .doc（演示）");
  b.querySelector('[data-a="edit"]').onclick = () => toast("直接说“第二条写得具体一点”就行（演示）");
  addMade("📝", (pk === "office" ? "周报" : "小结") + "初稿", 40, "fri");
}

// ---------- ⑤ 周日：带用户把想法做成网站（SQLite） ----------
const STEPS = ["想法", "功能", "数据", "页面", "上线"];
async function sceneSun() {
  const s = p.site;
  await bot(`<p>${esc(p.hi)}，现在开始做<b>“${esc(s.name)}”</b>吧。一共 5 步，每步我只问一两个问题，大约 20 分钟。中途离开也没关系，进度会存在左边的 🚀 项目里。</p>`);
  const st = { step: 0, audience: null, feats: s.features.map((f) => !!f[1]), sql: false };
  const b = await bot("", "card");
  const draw = () => {
    const bar = `<div class="steps">${STEPS.map((n, i) => `<div class="st ${i < st.step ? "done" : i === st.step ? "cur" : ""}"><div class="dot">${i < st.step ? "✓" : i + 1}</div>${n}</div>`).join("")}</div>`;
    let body = "";
    if (st.step === 0) body = `<p><b>先确定一件事：主要给谁用？</b></p>${s.audience.map((a, i) => `<label class="opt" data-aud="${i}">${esc(a)}</label>`).join("")}${why(s.why)}`;
    if (st.step === 1) body = `<p>好，给<b>${esc(st.audience)}</b>用。根据你的情况，我建议先做打勾的这几个，其他的以后再加：</p>${s.features.map(([f], i) => `<label class="opt"><input type="checkbox" data-f="${i}" ${st.feats[i] ? "checked" : ""}> ${esc(f)}</label>`).join("")}<div class="btns"><button class="btn pri" data-next>就这些，下一步</button></div>`;
    if (st.step === 2) body = `<p>我把要记的东西整理成了 ${s.tables.length} 张表，存在 <b>SQLite</b> 数据库里（放在 Cloudflare D1，不用你管服务器）。看看有没有漏的：</p>
      <div class="tables">${s.tables.map(([t, cols]) => `<div class="tbl"><b>${t}</b>${cols.map((c) => `<div class="${/PK/.test(c) ? "pk" : /FK/.test(c) ? "fk" : ""}">${c.replace(" PK", " 🔑").replace(" FK", " → ")}</div>`).join("")}</div>`).join("")}</div>
      <p class="muted">🔑 主键 · → 关联到另一张表</p>
      ${st.sql ? `<pre class="sql">${esc(sqlOf(s.tables))}</pre>` : ""}
      <div class="btns"><button class="btn pri" data-next>看起来对，下一步</button><button class="btn" data-sql>${st.sql ? "收起" : "看建表语句"}</button><button class="btn" data-toast="直接说“顾客还要记生日”，我来改表（演示）">还要加点东西</button></div>`;
    if (st.step === 3) body = `<p>首页大概是这样的，手机上也能用：</p>
      <div class="browser"><div class="top">● ● ● <span>${s.slug}.accrepo.com</span></div><div class="site"><h2>${esc(s.preview.h)}</h2><div class="muted">${esc(s.preview.sub)}</div>
      <div class="grid">${s.preview.items.map(([n, v, c]) => `<div class="it"><div class="ph" style="background:${c}"></div>${esc(n)} <b style="float:right">${esc(v)}</b></div>`).join("")}</div></div></div>
      <div class="btns"><button class="btn pri" data-next>就这样，上线</button><button class="btn" data-toast="直接说“颜色换成绿色”“图片大一点”就行（演示）">改一改</button></div>`;
    if (st.step === 4) body = `<p>正在发布……</p><div class="progress"><i></i></div><div class="done-msg"></div>`;
    b.innerHTML = `<div class="ctitle">🚀 ${esc(s.name)} <span class="badge b-pri">项目</span></div>${bar}${body}`;
    b.querySelectorAll("[data-aud]").forEach((o) => o.onclick = () => { st.audience = s.audience[+o.dataset.aud]; st.step = 1; draw(); });
    b.querySelectorAll("[data-f]").forEach((c) => c.onchange = () => st.feats[+c.dataset.f] = c.checked);
    const nx = b.querySelector("[data-next]"); if (nx) nx.onclick = () => { st.step++; draw(); };
    const sq = b.querySelector("[data-sql]"); if (sq) sq.onclick = () => { st.sql = !st.sql; draw(); };
    b.querySelectorAll("[data-toast]").forEach((x) => x.onclick = () => toast(x.dataset.toast));
    if (st.step === 4) {
      requestAnimationFrame(() => { const i = b.querySelector(".progress i"); if (i) i.style.width = "100%"; });
      setTimeout(() => {
        b.querySelector(".done-msg").innerHTML = `<p>🎉 <b>上线了！</b> <a href="#" onclick="return false">https://${s.slug}.accrepo.com</a> <span class="muted">（演示地址）</span></p>
          <ul class="plain"><li>已经能用：${s.features.filter((_, i) => st.feats[i]).map((f) => esc(f[0])).join("、")}</li><li>我在 🚀 项目里记下了进度，下周日提醒你看看有多少人用、收集反馈</li><li>“想做的事”里的这个想法已标为<b>做成了</b></li></ul>
          <div class="btns"><button class="btn pri" data-toast="已复制链接，可以发到群里（演示）">复制链接分享</button><button class="btn" data-toast="下一版可以加：${esc(s.features.filter((_, i) => !st.feats[i]).map((f) => f[0]).join("、") || "更多功能")}（演示）">下一步加什么？</button></div>`;
        b.querySelector("p").textContent = "发布完成";
        b.querySelectorAll("[data-toast]").forEach((x) => x.onclick = () => toast(x.dataset.toast));
        if (!made.find((m) => m.scene === "sun")) addMade("🚀", s.name + " 已上线", 120, "sun");
        scroll();
      }, window.DEMO_FAST ? 0 : 1800);
    }
    scroll();
  };
  draw();
}
function sqlOf(tables) {
  return tables.map(([t, cols]) => `CREATE TABLE ${t} (\n${cols.map((c) => { const [n] = c.split(" "); if (/PK/.test(c)) return `  ${n} INTEGER PRIMARY KEY`; if (/FK/.test(c)) return `  ${n} INTEGER REFERENCES ${n.replace("_id", "") === "category" ? "categories" : n.replace("_id", "") + "s"}(id)`; return `  ${n} ${/amount|price|limit|qty|stems|points|quota/.test(n) ? "NUMERIC" : "TEXT"}`; }).join(",\n")}\n);`).join("\n\n");
}

// ---------- 自由输入 ----------
function ask(text) {
  text = text.trim(); if (!text) return; $("#input").value = "";
  busy = busy.then(async () => {
    if (/周报|小结|总结/.test(text)) { me(text); return sceneFri(); }
    if (/网站|做出来|开始做|小程序/.test(text)) { me(text); return sceneSun(); }
    if (/找|搜|那段|在哪|哪里|说.*的/.test(text)) return sceneSearch(text);
    if (/今天|安排/.test(text)) { me(text); return bot(`<p>今天：</p><ul class="plain">${p.mon.today.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>`); }
    if (/会|录音/.test(text)) { me(text); return sceneWed(); }
    me(text);
    await bot(`<p>（演示）记下了。这个临时演示只做了 5 个场景，可以试试下面的建议说法，或点上面的时间点。</p>`);
  });
}
$("#send").onclick = () => ask($("#input").value);
$("#input").onkeydown = (e) => { if (e.key === "Enter" && !e.isComposing) ask(e.target.value); };
document.querySelectorAll("[data-toast]").forEach((x) => x.onclick = (e) => { e.preventDefault(); toast(x.dataset.toast); });

// ---------- 身份切换 / 重来 / 自动播放 ----------
$("#persona").innerHTML = Object.entries(P).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join("");
function reset(silent) {
  clearTimeout(autoTimer); autoTimer = null; $("#auto").textContent = "▶ 自动播放";
  inner.innerHTML = ""; played.clear(); current = null; made = []; savedMin = 0; busy = Promise.resolve();
  renderProfile(); renderChips(); renderMade(); renderTimeline();
  const d = document.createElement("div"); d.className = "msg";
  d.innerHTML = `<div class="av">🤖</div><div class="bub" style="background:#fffbea;border-color:#fde68a"><p><b>这是 v6 助手页的临时演示</b>（不是正式原型）。</p><p>现在你的身份是 <b>${esc(p.label)}</b>。点上面的 5 个时间点，看一周里我会<b>主动</b>替你做什么：整理会议、找资料（录音 / 视频 / 图片 / 文档）、写${pk === "office" ? "周报" : "小结"}、把一个想法做成网站。换个身份再看一遍，内容会跟着变。</p></div>`;
  inner.appendChild(d);
  if (!silent) play("mon");
}
$("#persona").onchange = (e) => { pk = e.target.value; p = P[pk]; reset(); };
$("#reset").onclick = () => reset();
$("#auto").onclick = () => {
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; $("#auto").textContent = "▶ 自动播放"; return; }
  $("#auto").textContent = "⏸ 暂停";
  const step = () => { const next = SCENES.find((s) => !played.has(s.id)); if (!next) { autoTimer = null; $("#auto").textContent = "▶ 自动播放"; return; } play(next.id).then(() => { autoTimer = setTimeout(step, 3500); }); };
  step();
};
const qp = new URLSearchParams(location.search).get("as"); if (P[qp]) { pk = qp; p = P[pk]; $("#persona").value = pk; }
reset();
</script>
</body>
</html>
